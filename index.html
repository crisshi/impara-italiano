  vocab:[
    {e:"sembra impossibile sopravvivere",m:"看起来不可能生存/维持生活",d:"sopravvivere 意为'生存'或'活下去'。",ex:"Con questo stipendio sembra impossibile sopravvivere in una città così costosa.",exZh:"用这样的薪水在这么昂贵的城市里似乎不可能生存。"},
    {e:"un budget piccolo",m:"小预算，有限的预算",d:"同义词：pochi soldi da spendere（有限的消费预算）。",ex:"Nonostante un budget piccolo, siamo riusciti a organizzare una bella festa.",exZh:"尽管预算有限，我们还是成功举办了一场漂亮的派对。"},
    {e:"in tasca",m:"在口袋里",d:"",ex:"Ho solo venti euro in tasca oggi.",exZh:"今天我口袋里只有二十欧元。"},
    {e:"Andiamo a chiederlo in giro",m:"我们去四处询问",d:"in giro 意为'四处、到处'。",ex:"Non sono sicuro del prezzo, andiamo a chiederlo in giro.",exZh:"我不确定价格，我们去四处打听一下。"},
    {e:"Non ne ho idea",m:"我不知道，我没有概念",d:"",ex:"Non ne ho idea di come funzioni questo apparecchio.",exZh:"我完全不知道这个设备是如何工作的。"},
    {e:"poche cose",m:"很少的东西",d:"",ex:"Con questo denaro posso comprare poche cose al supermercato.",exZh:"用这些钱我只能在超市买很少的东西。"},
    {e:"in una giornata",m:"在一天之内",d:"",ex:"È impossibile visitare tutti i musei di Roma in una giornata.",exZh:"在一天之内参观罗马所有的博物馆是不可能的。"},
    {e:"buon cibo",m:"好食物，美食",d:"",ex:"In Italia si trova sempre del buon cibo a prezzi ragionevoli.",exZh:"在意大利总能找到价格合理的美食。"},
    {e:"gadgettistica",m:"小物件，小玩意",d:"从英语 'gadget' 派生的意大利语名词，指各种小物件或小饰品。",ex:"Il negozio vende tanta gadgettistica per smartphone.",exZh:"这家商店销售很多智能手机的小配件。"},
    {e:"Bisognerebbe chiederlo a mia moglie",m:"应该问我妻子",d:"Bisognerebbe 是 dovere 的条件式，表示'应该做某事'的委婉建议。",ex:"Non so cosa mangeremo stasera, bisognerebbe chiederlo a mia moglie.",exZh:"我不知道今晚吃什么，应该问问我妻子。"},
    {e:"fa la spesa",m:"购物，买菜",d:"特指购买日常生活用品和食物。",ex:"Di solito fa la spesa al supermercato il sabato mattina.",exZh:"他通常在周六上午去超市买东西。"},
    {e:"non so",m:"我不知道，不确定",d:"",ex:"Non so se riuscirò a venire alla festa domani.",exZh:"我不知道明天能否来参加派对。"},
    {e:"cappuccio",m:"卡布奇诺（意大利式咖啡饮品）",d:"",ex:"Ogni mattina bevo un cappuccio al bar vicino all'ufficio.",exZh:"每天早上我都在办公室附近的咖啡店喝一杯卡布奇诺。"},
    {e:"brioche",m:"羊角面包，甜面包",d:"",ex:"In Italia è comune fare colazione con cappuccio e brioche.",exZh:"在意大利，用卡布奇诺和羊角面包做早餐很常见。"},
    {e:"qualcos'altro",m:"其他的东西，别的",d:"",ex:"Hai bisogno di qualcos'altro oltre al caffè?",exZh:"除了咖啡，你还需要别的东西吗？"},
    {e:"poca cosa",m:"没什么，很少的东西",d:"",ex:"Con dieci euro è poca cosa quello che puoi comprare oggi.",exZh:"今天用十欧元能买到的东西真的很少。"},
    {e:"un paio di panini",m:"两个三明治",d:"un paio di 意为'一对、两个'。",ex:"Per pranzo ho mangiato un paio di panini al prosciutto.",exZh:"午餐时我吃了两个火腿三明治。"},
    {e:"senza niente dentro",m:"里面什么都没有，空的",d:"同义词：vuoti（空的）。",ex:"Questo panino è senza niente dentro, è solo pane.",exZh:"这个三明治里面什么都没有，只是面包。"},
    {e:"è un po' esagerato",m:"有点夸张，有点过分",d:"esagerato 意为'夸张的'或'过分的'。",ex:"Dire che è il peggior film di sempre è un po' esagerato.",exZh:"说这是有史以来最糟糕的电影有点夸张。"},
    {e:"Ben poco",m:"非常少，几乎没有",d:"同义词：molto poco（非常少）。",ex:"Con questi soldi puoi fare ben poco in una città così cara.",exZh:"在这么贵的城市里，用这些钱你几乎什么都做不了。"},
    {e:"libro economico",m:"便宜的书，平装书",d:"同义词：libro a basso prezzo（低价书）。",ex:"Ho trovato un libro economico sulla storia di Roma.",exZh:"我找到了一本关于罗马历史的便宜书。"},
    {e:"prendersi un caffè",m:"喝杯咖啡",d:"同义词：bere un caffè（喝咖啡）。",ex:"Facciamo una pausa per prenderci un caffè.",exZh:"我们休息一下，喝杯咖啡。"},
    {e:"a stenti con un panino",m:"勉强够买一个三明治",d:"a stenti 意为'勉强'或'艰难地'；同义词：con difficoltà（勉强地）。",ex:"Con questi soldi posso comprare a stenti un panino per pranzo.",exZh:"用这些钱我勉强能买一个三明治当午餐。"},
    {e:"bottiglia d'acqua",m:"一瓶水",d:"同义词：acqua in bottiglia（瓶装水）。",ex:"Durante l'escursione è importante portare una bottiglia d'acqua.",exZh:"徒步旅行时带一瓶水很重要。"},
    {e:"non molto di più",m:"不会更多了，没有更多",d:"",ex:"Con questo budget possiamo comprare questo e non molto di più.",exZh:"用这个预算我们可以买这个，但不会更多了。"},
    {e:"il biglietto della metropolitana",m:"地铁票",d:"",ex:"Il biglietto della metropolitana a Milano costa 2 euro.",exZh:"米兰的地铁票价格是2欧元。"},
    {e:"Esatto",m:"没错，正确",d:"",ex:"\"Ci vediamo alle nove?\" \"Esatto, alle nove in punto.\"",exZh:"\"我们九点见面？\" \"没错，九点整。\""},
    {e:"più cara o più economica",m:"更贵还是更便宜",d:"",ex:"Non so se questa marca sia più cara o più economica rispetto all'altra.",exZh:"我不知道这个品牌比另一个更贵还是更便宜。"},
    {e:"le stesse cose",m:"同样的东西",d:"",ex:"In entrambi i negozi vendono le stesse cose.",exZh:"两家商店卖的都是同样的东西。"},
    {e:"più o meno",m:"或多或少，大致上",d:"",ex:"Il prezzo è più o meno lo stesso in tutti i negozi del centro.",exZh:"市中心所有商店的价格大致相同。"},
    {e:"cifre più alte",m:"更高的价格，更大的数字",d:"同义词：prezzi maggiori（更高的价格）。",ex:"Per una casa in centro devi pensare a cifre più alte.",exZh:"对于市中心的房子，你要考虑更高的价格。"},
    {e:"vestiti",m:"衣服，服装",d:"指各种类型的衣物。",ex:"Ho comprato dei vestiti nuovi per l'inverno.",exZh:"我为冬季买了新衣服。"},
    {e:"prodotti commerciali",m:"商业产品，商品",d:"",ex:"Questo negozio vende vari prodotti commerciali a prezzi competitivi.",exZh:"这家商店以有竞争力的价格销售各种商品。"},
    {e:"C'è un po' di differenza",m:"有一点差别",d:"同义词：c'è qualche differenza（有一些差异）。",ex:"C'è un po' di differenza tra questi due modelli di smartphone.",exZh:"这两款智能手机型号之间有一点差别。"},
    {e:"nord Italia e Sud Italia",m:"意大利北部和南部",d:"",ex:"Ci sono differenze culturali tra nord Italia e Sud Italia.",exZh:"意大利北部和南部之间存在文化差异。"},
    {e:"si aggirano più o meno uguali",m:"价格大致相同",d:"si aggirano 是动词 aggirarsi 的第三人称复数形式，意为'围绕/徘徊'，在价格上下文中表示'价格大约在...左右'；同义词：sono circa gli stessi（大约相同）。",ex:"I prezzi degli appartamenti in questa zona si aggirano più o meno uguali.",exZh:"这个区域的公寓价格大致相同。"},
    {e:"snack",m:"零食，小吃",d:"指在正餐之间食用的小食品；同义词：spuntini（小吃）。",ex:"Ho comprato degli snack per il viaggio in treno.",exZh:"我为火车旅行买了一些零食。"},
    {e:"bibite",m:"饮料",d:"指各种非酒精饮料；同义词：bevande（饮料）。",ex:"D'estate consumo molte bibite fresche.",exZh:"夏天我喝很多冷饮。"},
    {e:"quelle cose lì",m:"那些东西",d:"指代前面提到过或双方都知道的事物。",ex:"Non mi interessano quelle cose lì, preferisco qualcosa di più utile.",exZh:"我对那些东西不感兴趣，我更喜欢实用的东西。"},
    {e:"un po' di più da una parte rispetto che dall'altra",m:"一个地方比另一个地方贵一点",d:"",ex:"I ristoranti in centro costano un po' di più da una parte rispetto che dall'altra.",exZh:"市中心的餐厅在某些地方比其他地方贵一点。"}
  ]
}
,
7: {
  zh:"帮助我更好地学会健康饮食的最重要方法之一，肯定是每天坚持运动10分钟。锻炼的类型并不是特别重要，即使只是简单地在户外散步，或做一点轻度有氧运动，再或者做一些轻量的塑形训练，都已经足够了。重要的是让它成为一种稳定的习惯，也就是说，一个小而稳定的习惯。因为锻炼这件事总是会让我感觉更好，让我感受到更多的精力，也让我更有动力朝着我的外形目标前进。因此，当看到自己状态更好，更加喜欢自己，看起来更加紧致有型，感觉自己更加轻盈、更有活力。",
  it:"Una delle cose che mi hanno aiutato di più a imparare ad alimentarmi meglio è stato sicuramente, muovermi ogni giorno 10 minuti al giorno. Non è tanto importante la tipologia di allenamento: basta anche una semplice camminata all'aria aperta, un piccolo cardio, un piccolo allenamento tonificante. L'importante è che sia un'abitudine consolidata, cioè una piccola abitudine consolidata. Perché il fatto di allenarmi comunque mi fa sentire meglio, mi fa sentire una maggiore energia e mi fa sentire anche più motivata verso quelli che sono i miei obiettivi estetici. Quindi il fatto di vedermi meglio, di piacermi di più, di vedermi più tonica, in forma, di sentirmi più leggera ed energica.",
  sent:[
    {it:"Una delle cose che mi hanno aiutato di più a imparare ad alimentarmi meglio è stato sicuramente, muovermi ogni giorno 10 minuti al giorno.",zh:"帮助我更好地学会健康饮食的最重要方法之一，肯定是每天坚持运动10分钟。"},
    {it:"Non è tanto importante la tipologia di allenamento: basta anche una semplice camminata all'aria aperta, un piccolo cardio, un piccolo allenamento tonificante.",zh:"锻炼的类型并不是特别重要，即使只是简单地在户外散步，或做一点轻度有氧运动，再或者做一些轻量的塑形训练，都已经足够了。"},
    {it:"L'importante è che sia un'abitudine consolidata, cioè una piccola abitudine consolidata.",zh:"重要的是让它成为一种稳定的习惯，也就是说，一个小而稳定的习惯。"},
    {it:"Perché il fatto di allenarmi comunque mi fa sentire meglio, mi fa sentire una maggiore energia e mi fa sentire anche più motivata verso quelli che sono i miei obiettivi estetici.",zh:"因为锻炼这件事总是会让我感觉更好，让我感受到更多的精力，也让我更有动力朝着我的外形目标前进。"},
    {it:"Quindi il fatto di vedermi meglio, di piacermi di più, di vedermi più tonica, in forma, di sentirmi più leggera ed energica.",zh:"因此，当看到自己状态更好，更加喜欢自己，看起来更加紧致有型，感觉自己更加轻盈、更有活力。"}
  ],
  vocab:[
    {e:"mi hanno aiutato",m:"帮助了我",d:"第三人称复数完成时，表示\"他们帮助了我\"。同义词：mi sono stati d'aiuto, mi hanno dato una mano。",ex:"I miei amici mi hanno aiutato a traslocare.",exZh:"我的朋友们帮我搬家了。"},
    {e:"imparare ad alimentarmi meglio",m:"学会更好地饮食",d:"同义词：nutrirmi in modo più sano, mangiare più correttamente。",ex:"Dopo la visita dal dietologo, ho iniziato a imparare ad alimentarmi meglio.",exZh:"看了营养师后，我开始学习更好地饮食。"},
    {e:"sicuramente",m:"确实，毫无疑问",d:"同义词：certamente, senza dubbio。",ex:"Sicuramente verrò alla tua festa.",exZh:"我肯定会来参加你的派对。"},
    {e:"muovermi",m:"移动自己，活动",d:"同义词：fare movimento, essere attivo。",ex:"Devo muovermi di più per restare in forma.",exZh:"我必须多活动以保持身材。"},
    {e:"tipologia di allenamento",m:"训练/锻炼的类型",d:"同义词：tipo di esercizio fisico, genere di attività fisica。",ex:"Ogni tipologia di allenamento ha i suoi benefici specifici.",exZh:"每种训练类型都有其特定的好处。"},
    {e:"semplice camminata all'aria aperta",m:"简单的户外散步",d:"同义词：passeggiata all'aperto, camminata in natura。",ex:"Una semplice camminata all'aria aperta può migliorare l'umore.",exZh:"一次简单的户外散步可以改善心情。"},
    {e:"piccolo cardio",m:"轻度有氧运动",d:"同义词：breve allenamento cardiovascolare, esercizio aerobico leggero。",ex:"Faccio un piccolo cardio ogni mattina prima di colazione.",exZh:"我每天早餐前做一点轻度有氧运动。"},
    {e:"allenamento tonificante",m:"塑形/紧致训练",d:"同义词：esercizio di tonificazione, allenamento per rassodare i muscoli。",ex:"L'allenamento tonificante aiuta a definire i muscoli senza aumentarne eccessivamente il volume.",exZh:"塑形训练有助于定义肌肉而不过度增加体积。"},
    {e:"L'importante è che",m:"重要的是",d:"同义词：Ciò che conta è che, La cosa essenziale è che。该表达主观性强，从句需用虚拟语气。",ex:"L'importante è che tu sia felice con la tua scelta.",exZh:"重要的是你对自己的选择感到满意。"},
    {e:"un'abitudine consolidata",m:"一个巩固的/稳定的习惯",d:"同义词：una routine stabile, un'abitudine radicata。",ex:"Leggere prima di dormire è diventata un'abitudine consolidata nella mia vita.",exZh:"睡前阅读已成为我生活中的一个稳定习惯。"},
    {e:"piccola abitudine consolidata",m:"小而稳定的习惯",d:"同义词：piccola routine stabile, piccola abitudine radicata。",ex:"Bere un bicchiere d'acqua appena sveglio è una piccola abitudine consolidata che migliora la mia salute.",exZh:"起床后喝一杯水是一个有益健康的小而稳定的习惯。"},
    {e:"il fatto di allenarmi",m:"锻炼这件事/锻炼的事实",d:"同义词：l'atto di fare esercizio, il praticare attività fisica。",ex:"Il fatto di allenarmi regolarmente ha migliorato il mio sonno.",exZh:"经常锻炼这件事改善了我的睡眠。"},
    {e:"mi fa sentire meglio",m:"让我感觉更好",d:"同义词：migliora il mio stato d'animo, aumenta il mio benessere。",ex:"La meditazione mi fa sentire meglio quando sono stressato.",exZh:"当我有压力时，冥想让我感觉更好。"},
    {e:"mi fa sentire una maggiore energia",m:"让我感受到更多的精力",d:"同义词：mi dà più vitalità, aumenta il mio livello energetico。",ex:"Mangiare frutta fresca mi fa sentire una maggiore energia durante la giornata.",exZh:"吃新鲜水果让我在一天中感受到更多的精力。"},
    {e:"i miei obiettivi estetici",m:"我的外形/美观目标",d:"与外表或身体形象相关的个人目标。同义词：i miei scopi riguardanti l'aspetto fisico。",ex:"Uno dei miei obiettivi estetici è avere braccia più toniche.",exZh:"我的外形目标之一是拥有更紧实的手臂。"},
    {e:"piacermi di più",m:"更喜欢自己",d:"同义词：apprezzarmi maggiormente, essere più soddisfatto di me stesso。",ex:"Dopo aver perso peso, ho iniziato a piacermi di più quando mi guardo allo specchio.",exZh:"减肥后，我开始在镜子前更喜欢自己了。"},
    {e:"più tonica",m:"更紧致/更有张力",d:"同义词：più soda, più rassodata。",ex:"Con questi esercizi, la mia pelle sembra più tonica.",exZh:"通过这些锻炼，我的皮肤看起来更紧致了。"},
    {e:"più leggera",m:"更轻盈",d:"同义词：meno pesante, più agile。",ex:"Dopo la detox, mi sento più leggera e meno gonfia.",exZh:"排毒后，我感觉更轻盈，不那么浮肿了。"},
    {e:"energica",m:"精力充沛的/有活力的",d:"同义词：vivace, vitale, piena di energia。",ex:"Dopo una buona notte di sonno mi sento energica tutto il giorno.",exZh:"经过一晚好睡眠后，我整天都感到精力充沛。"}
  ]
}
,
8: {
  zh:"幸好有太阳，这周天气一直不好，每天都在下雨。不过我觉得雨是晚上下的，因为这两天白天都有太阳，天气非常好。所以我觉得是晚上下雨。不管怎样，我们现在精神状态都超级好，已经重新开始我们的日常工作和其他事务了。",
  it:"Meno male che c'è il sole, aveva messo brutto questa settimana e c'era pioggia tutti i giorni. eh però secondo me sta piovendo di notte, perché poi sono 2 giorni che c'è il sole c'è una bellissima giornata. Quindi secondo me piove di notte. comunque noi siamo super carichi, stiamo già ricominciando la nostra routine lavoro eccetera.",
  sent:[
    {it:"Meno male che c'è il sole, aveva messo brutto questa settimana e c'era pioggia tutti i giorni.",zh:"幸好有太阳，这周天气一直不好，每天都在下雨。"},
    {it:"eh però secondo me sta piovendo di notte, perché poi sono 2 giorni che c'è il sole c'è una bellissima giornata.",zh:"不过我觉得雨是晚上下的，因为这两天白天都有太阳，天气非常好。"},
    {it:"Quindi secondo me piove di notte.",zh:"所以我觉得是晚上下雨。"},
    {it:"comunque noi siamo super carichi, stiamo già ricominciando la nostra routine lavoro eccetera.",zh:"不管怎样，我们现在精神状态都超级好，已经重新开始我们的日常工作和其他事务了。"}
  ],
  vocab:[
    {e:"Meno male",m:"幸好",d:"表示庆幸某事发生或存在，相当于\"还好\"\"幸亏\"。同义词：per fortuna, fortunatamente, grazie al cielo。",ex:"Meno male che hai portato l'ombrello, sta iniziando a piovere.",exZh:"幸好你带了伞，开始下雨了。"},
    {e:"aveva messo brutto",m:"天气一直不好",d:"描述天气变差的表达，字面意思是\"变得难看/糟糕\"。同义词：il tempo era cattivo, faceva brutto tempo。",ex:"Ieri aveva messo brutto, quindi siamo rimasti a casa.",exZh:"昨天天气不好，所以我们待在家里。"},
    {e:"tutti i giorni",m:"每天/天天",d:"同义词：ogni giorno, quotidianamente。",ex:"Faccio jogging tutti i giorni per mantenermi in forma.",exZh:"我每天慢跑以保持身材。"},
    {e:"secondo me",m:"我认为/依我看",d:"同义词：a mio parere, a mio avviso, per me。",ex:"Secondo me, questo film è uno dei migliori dell'anno.",exZh:"我认为，这部电影是今年最好的电影之一。"},
    {e:"sta piovendo di notte",m:"雨是晚上下的/晚上在下雨",d:"同义词：piove durante la notte, cade la pioggia di notte。",ex:"Sta piovendo di notte, quindi non disturba le nostre attività diurne.",exZh:"晚上在下雨，所以不会影响我们白天的活动。"},
    {e:"una bellissima giornata",m:"天气非常好/美好的一天",d:"同义词：una giornata splendida, una giornata meravigliosa。",ex:"Oggi c'è una bellissima giornata, andiamo al mare!",exZh:"今天天气非常好，我们去海边吧！"},
    {e:"piove di notte",m:"晚上下雨",d:"同义词：la pioggia cade di notte, durante la notte piove。",ex:"D'estate spesso piove di notte, mentre di giorno c'è il sole.",exZh:"夏天经常晚上下雨，而白天出太阳。"},
    {e:"siamo super carichi",m:"我们精神状态超级好/我们充满活力",d:"同义词：siamo pieni di energia, siamo molto motivati。",ex:"Dopo le vacanze siamo super carichi per iniziare questo nuovo progetto.",exZh:"假期之后，我们充满活力开始这个新项目。"},
    {e:"stiamo già ricominciando",m:"我们已经开始重新/我们已经再次开始",d:"表示某个活动或过程已经再次开始。同义词：abbiamo già ripreso, stiamo già riprendendo。",ex:"Dopo la pausa estiva, stiamo già ricominciando con le nostre lezioni.",exZh:"夏休之后，我们已经重新开始上课了。"},
    {e:"routine",m:"日常/常规",d:"日常生活中固定的活动或习惯。同义词：abitudini quotidiane, attività regolari。",ex:"La mia routine mattutina include yoga e colazione.",exZh:"我的早晨常规包括瑜伽和早餐。"},
    {e:"eccetera",m:"等等/诸如此类",d:"用于列举时表示\"等等\"\"以及其他类似的事物\"，通常用在列表末尾。缩写形式：ecc.。同义词：e così via, e via dicendo, e altro。",ex:"Nella mia valigia ho messo vestiti, scarpe, libri, eccetera.",exZh:"我的行李箱里装了衣服、鞋子、书籍等等。"}
  ]
}
,
9: {
  zh:"如何选择适合自己的完美面部精华？我来帮你！首先，你要明确自己想改善的皮肤问题，比如肤色暗沉、色斑、皱纹等等。为什么要使用面部精华呢？理由有很多，首先是因为精华通常比面霜含有更高浓度的活性成分；其次是因为精华质地轻盈，更容易被皮肤吸收，如果你想叠加使用多种精华产品也会更方便，这样还能通过叠加使用，让肌肤吸收到更多的活性成分。那么应该如何以及何时使用精华呢？应该在洁面之后、面霜之前使用。因此，完美的护肤顺序是：先洁面，再用精华，然后再涂抹面霜。在使用时要配合非常轻柔的动作，从脸部内侧向外侧涂抹，别忘了也要涂抹到脖子。",
  it:"Come scelgo il siero viso perfetto per me? Ti aiuto io! Innanzitutto individua la problematica o le problematiche che vuoi migliorare: colorito spento, macchie, rughe e via dicendo. Perché usare un siero viso? Ci sono diverse motivazioni: innanzitutto perché tendenzialmente ha una concentrazione di attivi più elevata rispetto a una crema, e poi perché, avendo una texture molto leggera e di facile assorbimento, è anche molto facile da stratificare nel caso in cui si vogliano utilizzare più sieri, e quindi anche più attivi combinandoli appunto tra di loro. Come si applica e quando si applica? Dopo la detersione e prima della crema viso. Quindi la routine perfetta, l'ordine perfetto è: detersione, siero viso e poi crema viso. Si applica con movimenti molto delicati, dall'interno verso l'esterno, senza dimenticarsi del collo.",
  sent:[
    {it:"Come scelgo il siero viso perfetto per me? Ti aiuto io!",zh:"如何选择适合自己的完美面部精华？我来帮你！"},
    {it:"Innanzitutto individua la problematica o le problematiche che vuoi migliorare: colorito spento, macchie, rughe e via dicendo.",zh:"首先，你要明确自己想改善的皮肤问题，比如肤色暗沉、色斑、皱纹等等。"},
    {it:"Perché usare un siero viso? Ci sono diverse motivazioni: innanzitutto perché tendenzialmente ha una concentrazione di attivi più elevata rispetto a una crema, e poi perché, avendo una texture molto leggera e di facile assorbimento, è anche molto facile da stratificare nel caso in cui si vogliano utilizzare più sieri, e quindi anche più attivi combinandoli appunto tra di loro.",zh:"为什么要使用面部精华呢？理由有很多，首先是因为精华通常比面霜含有更高浓度的活性成分；其次是因为精华质地轻盈，更容易被皮肤吸收，如果你想叠加使用多种精华产品也会更方便，这样还能通过叠加使用，让肌肤吸收到更多的活性成分。"},
    {it:"Come si applica e quando si applica? Dopo la detersione e prima della crema viso.",zh:"那么应该如何以及何时使用精华呢？应该在洁面之后、面霜之前使用。"},
    {it:"Quindi la routine perfetta, l'ordine perfetto è: detersione, siero viso e poi crema viso.",zh:"因此，完美的护肤顺序是：先洁面，再用精华，然后再涂抹面霜。"},
    {it:"Si applica con movimenti molto delicati, dall'interno verso l'esterno, senza dimenticarsi del collo.",zh:"在使用时要配合非常轻柔的动作，从脸部内侧向外侧涂抹，别忘了也要涂抹到脖子。"}
  ],
  vocab:[
    {e:"scelgo il siero viso perfetto",m:"选择适合自己的完美面部精华",d:"scelgo（我选择），动词原形 scegliere（选择）；il siero 精华液；viso 脸部、面部。同义词：seleziono il siero ideale per il viso, trovo il siero viso adatto。",ex:"Quando scelgo il siero viso perfetto, considero sempre il mio tipo di pelle.",exZh:"当我选择完美的面部精华时，我总是考虑我的皮肤类型。"},
    {e:"Ti aiuto io",m:"我来帮你",d:"同义词：ti do una mano, ti assisto io。",ex:"Non preoccuparti per il trasloco, ti aiuto io questo weekend.",exZh:"不用担心搬家的事，这个周末我来帮你。"},
    {e:"Innanzitutto",m:"首先",d:"同义词：prima di tutto, in primo luogo, anzitutto。",ex:"Innanzitutto, dobbiamo analizzare il problema prima di trovare una soluzione.",exZh:"首先，我们需要在找到解决方案之前分析问题。"},
    {e:"colorito spento",m:"肤色暗沉",d:"colorito 肤色、气色；spento 熄灭的、暗淡的、无光泽的。同义词：carnagione opaca, pelle senza luminosità。",ex:"L'uso di vitamina C può aiutare a migliorare il colorito spento della pelle.",exZh:"使用维生素C可以帮助改善肤色暗沉的问题。"},
    {e:"macchie",m:"色斑",d:"同义词：discromie, macchie cutanee, macchie della pelle。",ex:"La protezione solare aiuta a prevenire la formazione di macchie sul viso.",exZh:"防晒有助于预防脸上色斑的形成。"},
    {e:"rughe",m:"皱纹",d:"同义词：pieghe della pelle, linee d'espressione, segni dell'età。",ex:"L'acido ialuronico è un ingrediente efficace per ridurre le rughe.",exZh:"透明质酸是减少皱纹的有效成分。"},
    {e:"via dicendo",m:"等等/诸如此类",d:"表示列举未完，还有其他类似的事物。同义词：eccetera, e così via, e altro ancora。",ex:"Nella valigia ho messo vestiti, scarpe, libri e via dicendo.",exZh:"我的行李箱里装了衣服、鞋子、书籍等等。"},
    {e:"Perché usare",m:"为什么要使用",d:"询问使用某物的理由或好处。同义词：per quale motivo utilizzare, qual è il motivo per usare。",ex:"Perché usare prodotti biologici? Sono più rispettosi dell'ambiente.",exZh:"为什么要使用有机产品？它们更环保。"},
    {e:"diverse motivazioni",m:"很多不同的原因",d:"diverse 不同的、多样的；motivazioni 理由、原因（动机复数）。同义词：vari motivi, numerose ragioni。",ex:"Ci sono diverse motivazioni per imparare una lingua straniera.",exZh:"学习一门外语有很多不同的原因。"},
    {e:"tendenzialmente",m:"通常/一般来说",d:"表示一般趋势或倾向。同义词：generalmente, solitamente, di solito。",ex:"I giovani tendenzialmente preferiscono i social media alle email.",exZh:"年轻人通常更喜欢社交媒体而不是电子邮件。"},
    {e:"concentrazione di attivi più elevata",m:"更高浓度的活性成分",d:"concentrazione 浓度；attivi 活性成分（principi attivi 的简化）；elevata 高的。同义词：maggiore concentrazione di principi attivi, più alta percentuale di ingredienti attivi。",ex:"Questo prodotto ha una concentrazione di attivi più elevata, quindi è più efficace.",exZh:"这个产品有更高浓度的活性成分，因此更有效。"},
    {e:"crema",m:"面霜",d:"同义词：lozione, emulsione, idratante。",ex:"Applico la crema idratante ogni sera prima di andare a dormire.",exZh:"每晚睡前我都会涂抹保湿面霜。"},
    {e:"texture molto leggera e di facile assorbimento",m:"质地轻盈且易吸收",d:"texture 质地；leggera 轻盈的（阴性修饰 texture）；assorbimento 吸收。同义词：consistenza leggera e facilmente assorbibile, formula leggera che si assorbe rapidamente。",ex:"Preferisco i sieri con texture molto leggera e di facile assorbimento per la mia pelle grassa.",exZh:"对于我的油性皮肤，我更喜欢质地轻盈且易吸收的精华。"},
    {e:"facile da stratificare",m:"容易叠加使用",d:"stratificare 叠加、分层。同义词：facile da sovrapporre, si combina facilmente con altri prodotti。",ex:"Questo prodotto è facile da stratificare con altri trattamenti per la pelle.",exZh:"这个产品容易与其他护肤品叠加使用。"},
    {e:"attivi combinandoli",m:"活性成分相互结合",d:"attivi 活性成分（复数）；combinandoli 结合它们（combinare + li，副动词形式）。同义词：principi attivi che si combinano, ingredienti attivi che lavorano insieme。",ex:"Si ottengono risultati migliori attivi combinandoli in modo strategico.",exZh:"通过策略性地结合活性成分，可以获得更好的效果。"},
    {e:"Come si applica",m:"如何使用/怎么使用",d:"同义词：in che modo si usa, come si utilizza。",ex:"Come si applica correttamente la maschera per il viso?",exZh:"如何正确使用面膜？"},
    {e:"quando si applica",m:"什么时候使用",d:"同义词：in quale momento si utilizza, quando va usato。",ex:"Quando si applica il tonico nella routine di skincare?",exZh:"在护肤流程中什么时候使用爽肤水？"},
    {e:"la detersione",m:"洁面",d:"同义词：la pulizia del viso, il lavaggio del viso。",ex:"La detersione è il primo passo essenziale di ogni routine di bellezza.",exZh:"洁面是每个美容程序的第一个基本步骤。"},
    {e:"crema viso",m:"面霜",d:"同义词：crema per il viso, crema facciale。",ex:"Applico la crema viso ogni mattina dopo la detersione.",exZh:"每天早上洁面后我都会涂抹面霜。"},
    {e:"la routine perfetta, l'ordine perfetto",m:"完美的护肤顺序",d:"routine 日常程序、习惯性步骤；ordine 顺序、次序。同义词：la sequenza ideale, i passaggi ottimali。",ex:"Per ottenere i migliori risultati, segui la routine perfetta consigliata dagli esperti.",exZh:"要获得最佳效果，请遵循专家推荐的完美护肤顺序。"},
    {e:"movimenti molto delicati",m:"非常轻柔的动作",d:"movimenti 动作（复数）；delicati 轻柔的、细致的。同义词：gesti delicati, tocchi leggeri。",ex:"Applica la crema con movimenti molto delicati per non irritare la pelle.",exZh:"用非常轻柔的动作涂抹面霜，以免刺激皮肤。"},
    {e:"dall'interno verso l'esterno",m:"从内向外",d:"interno 内部的（指脸部中心）；esterno 外部的（指脸部边缘）。同义词：dal centro verso la periferia, dal centro verso l'esterno del viso。",ex:"Massaggia il viso dall'interno verso l'esterno per stimolare la circolazione.",exZh:"从内向外按摩面部以促进血液循环。"},
    {e:"senza dimenticarsi del collo",m:"不要忘记涂抹脖子",d:"dimenticarsi 忘记；collo 脖子、颈部。同义词：ricordandosi di includere il collo, prestando attenzione anche al collo。",ex:"Applica la crema anti-età senza dimenticarsi del collo, che mostra i segni dell'invecchiamento.",exZh:"涂抹抗衰老面霜时不要忘记涂抹脖子，脖子也会显示老化迹象。"}
  ]
}
,
10: {
  zh:"下午好，欢迎回到我的新 vlog！今天我的心情特别好，因为天气太棒了，阳光明媚！今天是星期六，我的早晨是从在电脑前工作开始的。在 vlog 后面的部分，我会告诉你们我正在做什么。终于，我收到了正式的许可去做这件事！所以，我已经迫不及待了，心里还有点小激动！现在差不多是下午 3 点 30 分。我想出去走走，呼吸一下新鲜空气。我要去接我姐姐，然后我们一起去市中心逛逛。不过在那之前，我得先加油，因为车子的油箱已经快空了。我投了一张 20 欧元的纸币，然后选择了要加油的油泵，我打算在那里加油。接着，我打开油箱盖，加油。最近汽油价格上涨了，20 欧元大概能加 10 升左右的汽油。我一直选择在\"自助加油\"区域加油，因为这里的油价比人工服务区更便宜。",
  it:"Buon pomeriggio e bentornati ad un nuovo vlog! Oggi sono di buonissimo umore perché è una giornata di sole fantastica. Oggi è sabato, ho iniziato la giornata lavorando al computer. Più avanti nel vlog potrò dirvi su cosa sto lavorando. Finalmente ho ricevuto il via libera per farlo! Quindi non vedo l'ora! Ho un po' le farfalle nello stomaco. Comunque adesso sono le 3:30 del pomeriggio, più o meno. Voglio fare una passeggiata all'aria aperta e sto andando a prendere mia sorella e così andiamo a fare un giro in centro. Ma prima devo fare benzina perché attualmente la macchina è in riserva. Inserisco una banconota da €20 e poi seleziono la pompa da cui intendo fare rifornimento. Poi apro il bocchettone dell'auto e faccio benzina. Ultimamente il prezzo del carburante è aumentato. Con €20 rifornisco l'auto con 10 L di benzina più o meno. E faccio sempre benzina nella sezione \"fai da te\", dove costa meno della parte servita.",
  sent:[
    {it:"Buon pomeriggio e bentornati ad un nuovo vlog! Oggi sono di buonissimo umore perché è una giornata di sole fantastica.",zh:"下午好，欢迎回到我的新 vlog！今天我的心情特别好，因为天气太棒了，阳光明媚！"},
    {it:"Oggi è sabato, ho iniziato la giornata lavorando al computer. Più avanti nel vlog potrò dirvi su cosa sto lavorando.",zh:"今天是星期六，我的早晨是从在电脑前工作开始的。在 vlog 后面的部分，我会告诉你们我正在做什么。"},
    {it:"Finalmente ho ricevuto il via libera per farlo! Quindi non vedo l'ora! Ho un po' le farfalle nello stomaco.",zh:"终于，我收到了正式的许可去做这件事！所以，我已经迫不及待了，心里还有点小激动！"},
    {it:"Comunque adesso sono le 3:30 del pomeriggio, più o meno.",zh:"现在差不多是下午 3 点 30 分。"},
    {it:"Voglio fare una passeggiata all'aria aperta e sto andando a prendere mia sorella e così andiamo a fare un giro in centro.",zh:"我想出去走走，呼吸一下新鲜空气。我要去接我姐姐，然后我们一起去市中心逛逛。"},
    {it:"Ma prima devo fare benzina perché attualmente la macchina è in riserva.",zh:"不过在那之前，我得先加油，因为车子的油箱已经快空了。"},
    {it:"Inserisco una banconota da €20 e poi seleziono la pompa da cui intendo fare rifornimento.",zh:"我投了一张 20 欧元的纸币，然后选择了要加油的油泵，我打算在那里加油。"},
    {it:"Poi apro il bocchettone dell'auto e faccio benzina.",zh:"接着，我打开油箱盖，加油。"},
    {it:"Ultimamente il prezzo del carburante è aumentato. Con €20 rifornisco l'auto con 10 L di benzina più o meno.",zh:"最近汽油价格上涨了，20 欧元大概能加 10 升左右的汽油。"},
    {it:"E faccio sempre benzina nella sezione \"fai da te\", dove costa meno della parte servita.",zh:"我一直选择在\"自助加油\"区域加油，因为这里的油价比人工服务区更便宜。"}
  ],
  vocab:[
    {e:"buonissimo umore",m:"非常好的心情",d:"buonissimo 是 buono（好的）的最高级形式，意为\"非常好的\"；umore 心情，情绪。同义词：ottimo stato d'animo, eccellente disposizione。",ex:"Dopo aver ricevuto quella bella notizia, ero di buonissimo umore per tutto il giorno.",exZh:"收到那个好消息后，我整天都心情非常好。"},
    {e:"sole fantastica",m:"美好的阳光，阳光明媚",d:"sole 太阳，阳光；fantastica 极好的，精彩的。同义词：splendido sole, bellissima giornata di sole。",ex:"C'è un sole fantastico oggi, dovremmo andare in spiaggia.",exZh:"今天阳光很好，我们应该去海滩。"},
    {e:"cosa sto lavorando",m:"我正在做什么工作",d:"cosa 什么事物；sto lavorando 现在进行时，表示\"正在工作\"。同义词：a che progetto sto lavorando, su quale lavoro mi sto dedicando。",ex:"Ti dirò dopo cosa sto lavorando, è una sorpresa.",exZh:"我稍后会告诉你我在做什么工作，这是个惊喜。"},
    {e:"il via libera",m:"许可，批准，允许",d:"via 路，通道；libera 自由的，畅通的；合起来表示\"绿灯\"，比喻获得前进或行动的许可。同义词：l'autorizzazione, il permesso, l'approvazione。",ex:"Finalmente ho ricevuto il via libera per iniziare il progetto.",exZh:"我终于获得了开始这个项目的许可。"},
    {e:"non vedo l'ora",m:"我迫不及待，我等不及了（习语）",d:"字面意思是\"我看不到时间\"，实际表达强烈期待。同义词：sono impaziente, sono ansioso di。",ex:"Non vedo l'ora di andare in vacanza la prossima settimana.",exZh:"我迫不及待想去下周的假期了。"},
    {e:"Ho un po' le farfalle nello stomaco",m:"我有点紧张/激动",d:"习语，字面意思是\"肚子里有点蝴蝶\"，描述紧张或激动时胃部的感觉。farfalle 蝴蝶；stomaco 胃。同义词：sono un po' nervoso/emozionato。",ex:"Prima dell'esame avevo le farfalle nello stomaco.",exZh:"考试前我感到紧张。"},
    {e:"Voglio fare una passeggiata all'aria aperta",m:"我想在户外散步",d:"fare una passeggiata 散步；all'aria aperta 在户外，在露天。同义词：desidero camminare all'esterno。",ex:"Quando fa bel tempo, mi piace fare una passeggiata all'aria aperta.",exZh:"天气好的时候，我喜欢在户外散步。"},
    {e:"fare benzina",m:"加汽油",d:"fare 这里作为功能动词，表示\"进行\"；benzina 汽油。同义词：rifornire di carburante, riempire il serbatoio。",ex:"Prima di partire per il viaggio dobbiamo fare benzina.",exZh:"出发旅行前我们需要加油。"},
    {e:"la macchina è in riserva",m:"汽车油箱快空了",d:"macchina 汽车；in riserva 油表指示进入储备油量区域。同义词：l'auto è quasi senza benzina。",ex:"Accidenti, la macchina è in riserva e non ci sono distributori vicini.",exZh:"糟糕，汽车快没油了，附近也没有加油站。"},
    {e:"Inserisco una banconota da €20",m:"我投入一张20欧元的纸币",d:"inserisco 插入，投入（动词 inserire 的第一人称单数现在时）；banconota 纸币。同义词：metto una banconota di 20 euro。",ex:"Inserisco una banconota da €20 nel distributore automatico per comprare il biglietto.",exZh:"我在自动售票机里投入一张20欧元的纸币来买票。"},
    {e:"Seleziono",m:"我选择，我挑选",d:"动词 selezionare 的第一人称单数现在时。同义词：scelgo, opto per。",ex:"Seleziono sempre prodotti di qualità quando faccio la spesa.",exZh:"购物时我总是选择高质量的产品。"},
    {e:"la pompa",m:"加油泵，加油枪",d:"加油站用来给车辆加油的设备。同义词：l'erogatore di benzina, il distributore。",ex:"Ho scelto la pompa numero tre perché era l'unica libera.",exZh:"我选择了3号加油泵，因为只有它是空闲的。"},
    {e:"intendo fare rifornimento",m:"我打算加油",d:"intendo 我打算，我意图（动词 intendere 的第一人称单数现在时）；fare rifornimento 补给，加油，补充燃料。同义词：ho intenzione di fare benzina, voglio rifornire il serbatoio。",ex:"Intendo fare rifornimento prima di partire per il lungo viaggio.",exZh:"在开始长途旅行前我打算加油。"},
    {e:"apro il bocchettone dell'auto",m:"我打开汽车的油箱盖",d:"bocchettone 加油口，油箱盖；dell'auto 汽车的。同义词：apro il tappo del serbatoio。",ex:"Prima di fare benzina, apro il bocchettone dell'auto e rimuovo il tappo.",exZh:"加油前，我打开汽车的油箱盖并取下盖子。"},
    {e:"il prezzo del carburante è aumentato",m:"燃料价格上涨了",d:"prezzo 价格；carburante 燃料（比 benzina 更正式的表达）；è aumentato 已经增加（动词 aumentare 的过去分词）。同义词：il costo della benzina è salito。",ex:"Negli ultimi mesi il prezzo del carburante è aumentato di circa 20 centesimi al litro.",exZh:"最近几个月燃料价格每升上涨了大约20欧分。"},
    {e:"Rifornisco",m:"我加油，我补充(燃料)",d:"动词 rifornire 的第一人称单数现在时，意为\"重新供应\"或\"补充\"。同义词：riempio, faccio il pieno。",ex:"Rifornisco sempre l'auto quando il serbatoio è a metà.",exZh:"油箱半满时我总会给车加油。"},
    {e:"sezione \"fai da te\"",m:"自助加油区",d:"sezione 区域，部分；fai da te 自己动手做，DIY。同义词：area self-service, zona self。",ex:"Preferisco usare la sezione \"fai da te\" del distributore perché è più economica.",exZh:"我更喜欢使用加油站的自助区，因为更便宜。"},
    {e:"costa meno della parte servita",m:"比服务区便宜",d:"costa meno 更便宜（动词 costare 的第三人称单数现在时）；parte servita 有服务人员的区域。同义词：è più economico del servizio con personale。",ex:"La benzina nella zona self-service costa meno della parte servita, circa 20 centesimi in meno per litro.",exZh:"自助区的汽油比服务区便宜，每升大约便宜20欧分。"}
  ]
}
,
11: {
  zh:"所以，来市中心、在科索街一带逛逛，在阳光明媚的周六下午，这是个好主意吗？不，绝对不是！你们还想补充点什么吗？不，只是人真的太多了。你想说点什么吗？我太累了。现在我们在阿尔贝托·索尔迪长廊。我们来这里是想试着去一下最近刚刚在这边开业的伊吉尼奥·马萨里的店。不过呢……算了吧，人排得实在太多了！现在就是那种典型的时刻：你刚把外套脱掉，一阵冷风吹来，你就会生病。",
  it:"Allora, venire a passeggiare in centro nella zona di via del corso, il sabato pomeriggio con una bellissima giornata di sole è una buona idea? No, assolutamente no! Volete aggiungere qualcosa? No, semplicemente c'è troppa gente. Vuoi dire qualcosa? Sono esausta. Allora siamo nella Galleria Alberto Sordi e siamo venute qui perché volevamo provare a entrare da Iginio Massari che ha appena aperto qui. Però, insomma... Vabbè ma c'è troppa fila! Questa è la tipica stazione in cui se ti togli il giacchetto e arriva una folata di vento freddo, ti ammali.",
  sent:[
    {it:"Allora, venire a passeggiare in centro nella zona di via del corso, il sabato pomeriggio con una bellissima giornata di sole è una buona idea? No, assolutamente no!",zh:"所以，来市中心、在科索街一带逛逛，在阳光明媚的周六下午，这是个好主意吗？不，绝对不是！"},
    {it:"Volete aggiungere qualcosa? No, semplicemente c'è troppa gente.",zh:"你们还想补充点什么吗？不，只是人真的太多了。"},
    {it:"Vuoi dire qualcosa? Sono esausta.",zh:"你想说点什么吗？我太累了。"},
    {it:"Allora siamo nella Galleria Alberto Sordi e siamo venute qui perché volevamo provare a entrare da Iginio Massari che ha appena aperto qui.",zh:"现在我们在阿尔贝托·索尔迪长廊。我们来这里是想试着去一下最近刚刚在这边开业的伊吉尼奥·马萨里的店。"},
    {it:"Però, insomma... Vabbè ma c'è troppa fila!",zh:"不过呢……算了吧，人排得实在太多了！"},
    {it:"Questa è la tipica stazione in cui se ti togli il giacchetto e arriva una folata di vento freddo, ti ammali.",zh:"现在就是那种典型的时刻：你刚把外套脱掉，一阵冷风吹来，你就会生病。"}
  ],
  vocab:[
    {e:"Assolutamente no",m:"绝对不是！完全不行！",d:"assolutamente 副词，表示\"绝对地\"，\"完全地\"；no 否定词，\"不\"。同义词：Per niente!, Neanche per idea!, Assolutamente negativo!。",ex:"Vuoi mangiare quel cibo scaduto? Assolutamente no!",exZh:"你想吃那个过期食品吗？绝对不行！"},
    {e:"Aggiungere",m:"添加，补充",d:"动词不定式，表示\"添加\"或\"增加\"信息、观点等。同义词：integrare, addizionare, accrescere。",ex:"Vorrei aggiungere un commento a quanto detto prima.",exZh:"我想对之前说的添加一点评论。"},
    {e:"c'è troppa gente",m:"人太多了",d:"c'è 表示\"有\"的存在句式；troppa 太多的；gente 人群，人们。同义词：è molto affollato, ci sono troppe persone。",ex:"Non andiamo al centro commerciale sabato, c'è troppa gente.",exZh:"我们周六不去购物中心，那里人太多了。"},
    {e:"Sono esausta",m:"我筋疲力尽了，我太累了",d:"sono 我是（essere 的第一人称单数）；esausta 精疲力竭的，耗尽的（阴性形式）。同义词：sono stanchissima, sono sfinita。",ex:"Dopo la maratona, sono esausta e ho bisogno di riposare.",exZh:"马拉松之后，我筋疲力尽了，需要休息。"},
    {e:"nella Galleria Alberto Sordi",m:"在阿尔贝托·索尔迪长廊（罗马一个著名的购物中心）",d:"nella 在...里面（in + la）；Galleria 长廊，购物中心；Alberto Sordi 以意大利著名演员命名的地点。同义词：nel centro commerciale Alberto Sordi。",ex:"Ci incontriamo nella Galleria Alberto Sordi alle 15:00.",exZh:"我们下午3点在阿尔贝托·索尔迪长廊见面。"},
    {e:"ha appena aperto qui",m:"刚刚在这里开业",d:"ha aperto 已经开了（开业）；appena 刚刚，才；qui 这里。同义词：è stato inaugurato recentemente in questo posto。",ex:"Il nuovo ristorante ha appena aperto qui e vorrei provarlo.",exZh:"新餐厅刚刚在这里开业，我想去尝试一下。"},
    {e:"Vabbè",m:"好吧，算了吧（口语表达，表示妥协或放弃）",d:"口语缩写，来自\"va bene\"（好的，行）。同义词：va bene, comunque, pazienza。",ex:"Vabbè, se non vuoi venire andrò da solo.",exZh:"好吧，如果你不想来我就自己去。"},
    {e:"c'è troppa fila",m:"排队的人太多了",d:"c'è 有；troppa 太多的；fila 队伍，排队。同义词：c'è una coda lunghissima, bisogna aspettare troppo。",ex:"Volevo entrare al museo, ma c'è troppa fila e ho rinunciato.",exZh:"我想进博物馆，但排队的人太多了我就放弃了。"},
    {e:"la tipica stazione",m:"典型的情况/场景",d:"tipica 典型的，特有的；stazione 这里不是指\"车站\"，而是比喻某种情况。同义词：la situazione classica, la circostanza tipica。",ex:"È la tipica stazione in cui non sai come comportarti.",exZh:"这是典型的你不知道该怎么做的情况。"},
    {e:"ti togli il giacchetto",m:"你脱掉外套",d:"ti togli 你脱掉（动词 togliersi 的第二人称单数）；giacchetto 轻便外套，夹克。同义词：ti levi la giacca, ti spogli della giacca。",ex:"Se ti togli il giacchetto in montagna, rischi di prendere freddo.",exZh:"如果你在山上脱掉外套，你可能会着凉。"},
    {e:"una folata di vento freddo",m:"一阵冷风",d:"folata 一阵（风）；vento 风；freddo 冷的。同义词：una raffica di aria fredda, uno sbuffo di vento gelido。",ex:"Una folata di vento freddo mi ha fatto rabbrividire.",exZh:"一阵冷风使我打了个寒战。"},
    {e:"ti ammali",m:"你会生病",d:"动词 ammalare(si) 的第二人称单数现在时，表示\"生病\"。同义词：ti prendi un raffreddore, ti viene l'influenza。",ex:"Se esci con i capelli bagnati, ti ammali facilmente.",exZh:"如果你湿着头发出门，你很容易生病。"}
  ]
}
,
12: {
  zh:"巧克力还是覆盆子？嗯，我尝试了那个爆火的酸奶吐司食谱，真的太好吃了！做法超简单：我只需要把一个鸡蛋和酸奶、蜂蜜混合在一起，然后取两片全麦面包，压扁中心部分。再加入覆盆子和巧克力豆作为馅料。最后，放进空气炸锅，180°C 烘烤 13 分钟，就完成了！",
  it:"Cioccolato o lamponi? Ho provato la ricetta virale dello yogurt toast, davvero deliziosa! Mi è bastato unire un uovo con yogurt e miele, farcire due fette di pane integrale di cui avevo schiacciato il centro. Aggiungere lamponi e gocce di cioccolato. Puoi cuocere in friggitrice ad aria 13 minuti a 180 gradi.",
  sent:[
    {it:"Cioccolato o lamponi? Ho provato la ricetta virale dello yogurt toast, davvero deliziosa!",zh:"巧克力还是覆盆子？嗯，我尝试了那个爆火的酸奶吐司食谱，真的太好吃了！"},
    {it:"Mi è bastato unire un uovo con yogurt e miele, farcire due fette di pane integrale di cui avevo schiacciato il centro.",zh:"做法超简单：我只需要把一个鸡蛋和酸奶、蜂蜜混合在一起，然后取两片全麦面包，压扁中心部分。"},
    {it:"Aggiungere lamponi e gocce di cioccolato.",zh:"再加入覆盆子和巧克力豆作为馅料。"},
    {it:"Puoi cuocere in friggitrice ad aria 13 minuti a 180 gradi.",zh:"最后，放进空气炸锅，180°C 烘烤 13 分钟，就完成了！"}
  ],
  vocab:[
    {e:"lamponi",m:"覆盆子",d:"名词，复数形式，单数是 lampone。同义词：frutti di bosco rossi, more rosse。",ex:"Ho raccolto dei lamponi freschi nel bosco questa mattina.",exZh:"今天早上我在森林里采摘了新鲜的覆盆子。"},
    {e:"la ricetta virale dello yogurt toast",m:"爆火的酸奶吐司食谱",d:"ricetta：食谱，配方；virale：病毒式传播的，爆火的；yogurt：酸奶；toast：吐司。同义词：la preparazione dello yogurt toast che ha spopolato sui social。",ex:"Tutte le ricette virali su TikTok vengono provate dai giovani cuochi.",exZh:"所有在TikTok上爆火的食谱都被年轻厨师们尝试过。"},
    {e:"deliziosa",m:"美味的，可口的",d:"形容词，阴性单数形式。同义词：squisita, gustosa, buonissima。",ex:"La torta che hai preparato è davvero deliziosa.",exZh:"你做的蛋糕真的很美味。"},
    {e:"mi è bastato",m:"对我来说足够了，我只需要",d:"mi：代词，\"对我\"；è bastato：动词 bastare（足够）的过去分词。表示\"对我来说做某事就足够了\"或\"我只需要做某事\"。同义词：mi è stato sufficiente, ho avuto bisogno solo di。",ex:"Mi è bastato guardarlo per capire che era arrabbiato.",exZh:"我只需看他一眼就知道他生气了。"},
    {e:"unire un uovo con yogurt e miele",m:"把鸡蛋与酸奶和蜂蜜混合在一起",d:"unire：联合，混合；uovo：鸡蛋；yogurt：酸奶；miele：蜂蜜。同义词：mescolare un uovo con yogurt e miele, amalgamare gli ingredienti。",ex:"Per preparare la crema, devi unire le uova con lo zucchero e la vaniglia.",exZh:"要做奶油，你需要把鸡蛋与糖和香草混合。"},
    {e:"farcire",m:"填馅，填充，塞入（食物）",d:"动词不定式，在烹饪语境中常用来指给食物添加馅料。同义词：riempire, imbottire, guarnire。",ex:"Farcire i cannoli con la crema di ricotta.",exZh:"用里科塔奶酪馅填充意大利甜管。"},
    {e:"pane integrale",m:"全麦面包",d:"pane：面包；integrale：全麦的，未经精制的。同义词：pane di grano intero, pane completo。",ex:"Il pane integrale contiene più fibre rispetto a quello bianco.",exZh:"全麦面包比白面包含有更多纤维。"},
    {e:"avevo schiacciato il centro",m:"我已经压扁了中心部分",d:"avevo schiacciato：过去完成时，表示\"已经压扁\"；centro：中心，中央。同义词：avevo premuto al centro, avevo appiattito la parte centrale。",ex:"Avevo schiacciato la lattina prima di gettarla nel riciclo.",exZh:"在扔进回收箱前，我已经压扁了易拉罐。"},
    {e:"aggiungere lamponi e gocce di cioccolato",m:"添加覆盆子和巧克力豆",d:"aggiungere：添加；lamponi：覆盆子；gocce di cioccolato：巧克力豆（字面意思是\"巧克力滴\"）。同义词：inserire lamponi e pepite di cioccolato。",ex:"Per arricchire i muffin, puoi aggiungere gocce di cioccolato all'impasto.",exZh:"为了让松饼更丰富，你可以在面糊中添加巧克力豆。"},
    {e:"friggitrice ad aria",m:"空气炸锅",d:"friggitrice：炸锅，煎锅；ad aria：气炸的，空气的。同义词：fornetto ad aria calda, air fryer。",ex:"La friggitrice ad aria permette di cucinare in modo più sano rispetto alla frittura tradizionale.",exZh:"空气炸锅比传统油炸方式更健康地烹饪食物。"}
  ]
}

13: {
  zh:"那不勒斯披萨还是罗马披萨？那不勒斯披萨！那不勒斯！那不勒斯的，因为更松软一些。更松软，你呢？因为我喜欢披萨边缘（玉米饼边）。披萨边，选那不勒斯的！我更喜欢稍微软一点的披萨。罗马的。罗马披萨，因为它更脆一点。那不勒斯！那不勒斯披萨！罗马的。为什么选罗马披萨？你得好好解释一下哦！因为我不喜欢披萨的厚边缘（玉米饼边）。",
  it:"Pizza napoletana o pizza romana? Pizza napoletana! Napoletana! Napoletana, perché napoletana? Più soffice. Più soffice, per te perché? Mi piace il cornicione. Il cornicione, napoletana! Preferisco una pizza un po' più morbida. Romana. Romana, perché pizza romana? Perché è più croccante. Napoletana! Pizza napoletana! Romana. Perché pizza romana? Devi argomentare bene. Perché a me invece non piace il cornicione.",
  sent:[
    {it:"Pizza napoletana o pizza romana?",zh:"那不勒斯披萨还是罗马披萨？"},
    {it:"Pizza napoletana! Napoletana!",zh:"那不勒斯披萨！那不勒斯！"},
    {it:"Napoletana, perché napoletana? Più soffice.",zh:"那不勒斯的，因为更松软一些。"},
    {it:"Più soffice, per te perché? Mi piace il cornicione.",zh:"更松软，你呢？因为我喜欢披萨边缘（玉米饼边）。"},
    {it:"Il cornicione, napoletana! Preferisco una pizza un po' più morbida.",zh:"披萨边，选那不勒斯的！我更喜欢稍微软一点的披萨。"},
    {it:"Romana. Romana, perché pizza romana? Perché è più croccante.",zh:"罗马的。罗马披萨，因为它更脆一点。"},
    {it:"Napoletana! Pizza napoletana! Romana.",zh:"那不勒斯！那不勒斯披萨！罗马的。"},
    {it:"Perché pizza romana? Devi argomentare bene.",zh:"为什么选罗马披萨？你得好好解释一下哦！"},
    {it:"Perché a me invece non piace il cornicione.",zh:"因为我不喜欢披萨的厚边缘（玉米饼边）。"}
  ],
  vocab:[
    {e:"Pizza napoletana",m:"那不勒斯披萨",d:"指那不勒斯风格的披萨，特点是饼边厚且蓬松、中间薄。文化背景：那不勒斯披萨是联合国教科文组织认证的非物质文化遗产，有严格的制作标准；饼底中间薄（约0.3厘米）、边缘厚（1-2厘米），传统用柴火烤炉在高温（约485°C）下烤制60-90秒。同义词：pizza di Napoli。",ex:"La pizza napoletana è famosa in tutto il mondo.",exZh:"那不勒斯披萨在全世界都很有名。"},
    {e:"più soffice",m:"更松软",d:"soffice 松软的、蓬松的；più 更。同义词：più morbida, più soffice。",ex:"Il pane fatto in casa è più soffice di quello comprato.",exZh:"家制面包比买的更松软。"},
    {e:"il cornicione",m:"披萨边缘",d:"指披萨的饼边（外圈隆起部分），即中文语境中的\"玉米饼边\"。同义词：il bordo della pizza。",ex:"Il cornicione della pizza napoletana deve essere alto e soffice.",exZh:"那不勒斯披萨的边缘应该是高且松软的。"},
    {e:"un po' più morbida",m:"稍微更软一点的",d:"un po' 一点；più morbida 更软的。同义词：leggermente più soffice。",ex:"Preferisco la pasta un po' più morbida, non troppo al dente.",exZh:"我喜欢稍微更软一点的面食，不要太硬。"},
    {e:"più croccante",m:"更脆的",d:"più 更；croccante 酥脆的。同义词：più friabile, più croccante。",ex:"La pizza romana è più croccante grazie alla cottura più lunga.",exZh:"罗马披萨因为烤制时间更长而更脆。"},
    {e:"argomentare bene",m:"好好解释/论证",d:"argomentare 是动词，意为\"论证、说明理由\"；bene 意为\"好\"。同义词：spiegare chiaramente, giustificare。",ex:"Devi argomentare bene la tua posizione durante il dibattito.",exZh:"在辩论中你必须清楚地说明你的立场。"}
  ]
}
,
14: {
  zh:"我们习惯于把意大利想象成这样一个国家：这里的食物是全世界最美味的，这里的人穿着最有品味，这里有世界上最美丽的旅游景点。这些，确实是我们身份认同中非常重要的一部分。所以，人们会自然而然地认为，意大利的经济就是靠这些支撑起来的——靠美食、靠旅游，总之，靠那个闻名世界的\"意大利制造\"。但其实，除了这些之外，意大利经济还靠着另外一些东西支撑着。我亲眼见证了这一切，在全国各地奔走，走访了各个地区的企业，试图弄明白，一家家小作坊是如何成长为全球知名的工业巨头。又是为什么有些企业却没能成功，在全球化的竞争中被远远落下。最后，我终于真正明白了——意大利经济到底靠什么支撑起来的。",
  it:"Siamo abituati a pensare all'Italia com'è: il paese in cui si mangia meglio, ci si veste meglio e con i posti da visitare più belli al mondo. E questa è una parte, sicuramente importante, della nostra identità. E quindi verrebbe da pensare che l'economia italiana si regga proprio su questo: sul cibo, sul turismo, insomma, sul famoso made in Italy. Ecco, in realtà, oltre che su questo, l'economia italiana si regge su questo. L'ho visto con i miei occhi, girando l'Italia in lungo e in largo, visitando aziende in tutto il paese, per capire come piccole botteghe sono diventate colossi industriali riconosciuti in tutto il mondo. E come invece chi non ce l'ha fatta è rimasto indietro nella competizione globale. E alla fine ho capito davvero su cosa si regge l'economia italiana.",
  sent:[
    {it:"Siamo abituati a pensare all'Italia com'è: il paese in cui si mangia meglio, ci si veste meglio e con i posti da visitare più belli al mondo.",zh:"我们习惯于把意大利想象成这样一个国家：这里的食物是全世界最美味的，这里的人穿着最有品味，这里有世界上最美丽的旅游景点。"},
    {it:"E questa è una parte, sicuramente importante, della nostra identità.",zh:"这些，确实是我们身份认同中非常重要的一部分。"},
    {it:"E quindi verrebbe da pensare che l'economia italiana si regga proprio su questo: sul cibo, sul turismo, insomma, sul famoso made in Italy.",zh:"所以，人们会自然而然地认为，意大利的经济就是靠这些支撑起来的——靠美食、靠旅游，总之，靠那个闻名世界的\"意大利制造\"。"},
    {it:"Ecco, in realtà, oltre che su questo, l'economia italiana si regge su questo.",zh:"但其实，除了这些之外，意大利经济还靠着另外一些东西支撑着。"},
    {it:"L'ho visto con i miei occhi, girando l'Italia in lungo e in largo, visitando aziende in tutto il paese, per capire come piccole botteghe sono diventate colossi industriali riconosciuti in tutto il mondo.",zh:"我亲眼见证了这一切，在全国各地奔走，走访了各个地区的企业，试图弄明白，一家家小作坊是如何成长为全球知名的工业巨头。"},
    {it:"E come invece chi non ce l'ha fatta è rimasto indietro nella competizione globale.",zh:"又是为什么有些企业却没能成功，在全球化的竞争中被远远落下。"},
    {it:"E alla fine ho capito davvero su cosa si regge l'economia italiana.",zh:"最后，我终于真正明白了——意大利经济到底靠什么支撑起来的。"}
  ],
  vocab:[
    {e:"abituati a pensare",m:"习惯于思考/想象",d:"动词短语，\"习惯于以某种方式思考\"。abituati 是 abituare（使习惯）的过去分词，表示\"习惯的、适应的\"。同义词：soliti a credere, avvezzi a immaginare。",ex:"Siamo abituati a pensare che il mare sia sempre blu, ma può assumere molti colori.",exZh:"我们习惯认为海是蓝色的，但它可以呈现多种颜色。"},
    {e:"si mangia meglio",m:"吃得更好",d:"无人称结构，\"人们吃得更好\"。meglio 是副词 bene（好）的比较级，意为\"更好地\"。同义词：la cucina è migliore, il cibo è più buono。",ex:"In Italia si mangia meglio che in molti altri paesi europei.",exZh:"在意大利比在许多其他欧洲国家吃得更好。"},
    {e:"ci si veste meglio",m:"穿着更有品味",d:"无人称结构，\"人们穿得更好\"。同义词：le persone si vestono con più stile, l'abbigliamento è più elegante。",ex:"A Milano ci si veste meglio che in altre città italiane.",exZh:"在米兰，人们比其他意大利城市穿着更有品味。"},
    {e:"i posti da visitare più belli al mondo",m:"世界上最美丽的旅游景点",d:"posti 是 posto（地方）的复数形式；mondo 是名词\"世界\"。同义词：le località turistiche più attraenti del mondo, i luoghi più affascinanti da vedere。",ex:"La Costiera Amalfitana è uno dei posti da visitare più belli al mondo.",exZh:"阿马尔菲海岸是世界上最美丽的旅游景点之一。"},
    {e:"nostra identità",m:"我们的身份认同",d:"nostra 是形容词性物主代词，阴性单数；identità 是名词，阴性单数，\"身份、特性、认同感\"。同义词：il nostro carattere nazionale, la nostra essenza culturale。",ex:"La lingua italiana è parte fondamentale della nostra identità.",exZh:"意大利语是我们身份认同的基本组成部分。"},
    {e:"verrebbe da pensare",m:"会自然而然地想到",d:"条件式动词结构，表示\"人们会自然地认为/想到\"。verrebbe 是 venire（来）的条件式现在时第三人称单数。同义词：si potrebbe pensare, sarebbe naturale credere。",ex:"Verrebbe da pensare che sia facile, ma in realtà è molto complicato.",exZh:"人们会自然而然地认为这很容易，但实际上非常复杂。"},
    {e:"l'economia italiana si regga proprio su questo",m:"意大利经济就是靠这些支撑起来的",d:"reggersi su 是表示结构支撑或依赖的习语。si regga 是 reggersi（支撑自己、依靠）的虚拟式现在时第三人称单数；proprio 是副词，强调\"恰恰、正是\"。同义词：l'economia italiana si basi su questo, l'economia italiana dipenda da questo。",ex:"L'economia di Venezia si regge principalmente sul turismo.",exZh:"威尼斯的经济主要靠旅游业支撑。"},
    {e:"made in Italy",m:"意大利制造",d:"英语借词，指在意大利生产的商品，特别是高品质的时装、食品和工艺品。同义词：prodotto in Italia, di produzione italiana。",ex:"Le scarpe made in Italy sono famose per la loro qualità.",exZh:"意大利制造的鞋子以其质量而闻名。"},
    {e:"in realtà",m:"实际上，事实上",d:"副词短语，用于表示与预期或假设相反的真实情况。realtà 是名词，阴性单数，\"现实、实际\"。同义词：effettivamente, a dire il vero。",ex:"Sembra facile, ma in realtà richiede molto impegno.",exZh:"看起来容易，但实际上需要很多努力。"},
    {e:"si regge",m:"支撑，依赖",d:"反身动词 reggersi 的现在时形式，表示\"依靠、基于\"。同义词：si basa, si fonda, dipende。",ex:"Il suo argomento si regge su prove concrete.",exZh:"他的论点基于具体证据。"},
    {e:"visto con i miei occhi",m:"亲眼所见",d:"visto 是 vedere（看见）的过去分词。同义词：testimoniato personalmente, osservato direttamente。",ex:"L'ho visto con i miei occhi, quindi sono sicuro che sia successo.",exZh:"我亲眼所见，所以我确定这事发生了。"},
    {e:"girando l'Italia in lungo e in largo",m:"走遍意大利各地",d:"习语表达，字面意思是\"纵横穿越意大利\"，意为全面、彻底地游历。girando 是 girare（转、走、环游）的现在分词；lungo 长度；largo 宽度。同义词：percorrendo tutta l'Italia, visitando ogni angolo d'Italia。",ex:"Ha passato un anno girando l'Italia in lungo e in largo per il suo documentario.",exZh:"他花了一年时间走遍意大利各地为他的纪录片取材。"},
    {e:"botteghe",m:"作坊，小店铺",d:"传统的小型手工艺作坊或商店。同义词：laboratori artigianali, piccoli negozi。",ex:"Nelle botteghe del centro storico si possono trovare prodotti artigianali.",exZh:"在历史中心的小作坊里可以找到手工艺品。"},
    {e:"diventate colossi industriali riconosciuti in tutto il mondo",m:"成长为全球知名的工业巨头",d:"diventate 是 diventare（成为）的过去分词，阴性复数；colossi 是 colosso（巨头）的复数；industriali 工业的；riconosciuti 是 riconoscere 的过去分词，阳性复数。同义词：trasformate in grandi aziende di fama mondiale, evolute in imprese globali。",ex:"Alcune start-up italiane sono diventate colossi industriali riconosciuti in tutto il mondo in pochi anni.",exZh:"一些意大利初创公司在短短几年内成长为全球知名的工业巨头。"},
    {e:"chi non ce l'ha fatta",m:"那些没能成功的",d:"farcela 是表示\"成功\"的习语，这个短语指那些没有成功的人或企业。同义词：chi non ha avuto successo, chi ha fallito。",ex:"Rispetto chi non ce l'ha fatta ma ha comunque provato.",exZh:"我尊重那些虽然没有成功但至少尝试过的人。"},
    {e:"rimasto indietro",m:"落后，被抛在后面",d:"字面意思是\"留在后面\"，表示在竞争或进展中落后。rimasto 是 rimanere（留下）的过去分词，阳性单数；indietro 是副词\"向后、落后\"。同义词：è stato superato, non ha tenuto il passo。",ex:"Chi non si aggiorna rimane indietro nel mondo del lavoro.",exZh:"不更新知识的人在职场中会落后。"},
    {e:"competizione globale",m:"全球竞争",d:"competizione 是名词，阴性单数，\"竞争\"；globale 是形容词\"全球的、世界性的\"。同义词：concorrenza internazionale, sfida mondiale。",ex:"Le piccole aziende faticano nella competizione globale.",exZh:"小型企业在全球竞争中很艰难。"},
    {e:"ho capito davvero",m:"真正明白了",d:"davvero 是副词\"真正地、确实\"。同义词：ho compreso profondamente, ho realizzato pienamente。",ex:"Solo dopo anni di studio ho capito davvero come funziona questo sistema.",exZh:"只有在多年学习后，我才真正明白这个系统如何运作。"}
  ]
}
,
15: {
  zh:"你觉得旅行重要吗？（用非正式语气）您觉得旅行重要吗？（用正式语气）对我来说，嗯，旅行非常重要，不然我今天也不会在这里了。但让我们来听听大家怎么说：——因为可以认识新的城市。——哦，是的，我们一家人非常喜欢旅行，因为我们喜欢看到新鲜的事物，探索这个世界。——对我来说，旅行非常重要，可以认识新的地方，也可以结识新的人，还可以了解各地的文化。——嗯，是的，旅行很重要，因为通过旅行你会发现新的地方、不同的地方、不同的风俗和传统。——因为理解其他民族、了解他们怎么生活、他们的文化，以及那些与自己家乡不同的地方，是非常重要的。——是的，对我来说旅行非常重要，因为这样我可以发现新的地点、新的城市，在这些地方还可以参观他们的历史遗迹。——我热爱旅行，热爱发现新的文化，我从小就开始旅行，我想我永远都不会停止旅行。——对我来说旅行非常重要，因为通过旅行你可以发现很多新地方，遇见不同的人，积累经验，通过实践、亲身体验去学习。所以旅行绝对是很重要的。——我喜欢旅行，因为这样我能亲眼看到那些我曾在照片里看到的景点，这是一种非常不同的体验，因为照片中是无法真正呈现那些事物的美的，只有亲眼见到才能真正感受到它们的魅力。",
  it:"Per te è importante viaggiare? O formale, per Lei è importante viaggiare? Per me, beh, viaggiare è importantissimo, altrimenti non sarei qui oggi. Ma ascoltiamo le risposte della gente. Perché per conoscere nuove città. Oh sì, ci piace tanto viaggiare in famiglia, perché ci piace vedere cose nuove e scoprire il mondo. Per me è molto importante viaggiare per conoscere i nuovi posti, e per fare conoscenza di nuove persone e anche conoscere la cultura, appunto, dei posti. Beh, sì, è importante viaggiare perché viaggiando scopri i nuovi posti, posti diversi, usanze diverse, tradizioni. Perché è importante capire i popoli, come vivono, la loro cultura e anche i posti diversi da quelli che sono da quella che è casa propria. Sì, per me è molto importante viaggiare perché in questo modo posso scoprire nuovi luoghi, nuove città e in questi posti anche i loro monumenti. Amo viaggiare, scoprire nuove culture, e ho sempre viaggiato da quando sono piccola e non credo di smettere mai. Allora, per me è importantissimo viaggiare perché si scoprono un sacco di nuovi posti, si incontrano persone diverse e si fa esperienza, si impara facendo pratica e sul campo. Quindi è assolutamente importante. A me piace viaggiare perché in questo modo posso vedere dal vivo ciò che ho sempre visto in foto, ed è una cosa molto diversa, eh, perché nelle fotografie non si può vedere bene e realmente la bellezza delle cose che si vedono dal vivo.",
  sent:[
    {it:"Per te è importante viaggiare? O formale, per Lei è importante viaggiare? Per me, beh, viaggiare è importantissimo, altrimenti non sarei qui oggi. Ma ascoltiamo le risposte della gente.",zh:"你觉得旅行重要吗？（用非正式语气）您觉得旅行重要吗？（用正式语气）对我来说，嗯，旅行非常重要，不然我今天也不会在这里了。但让我们来听听大家怎么说："},
    {it:"Perché per conoscere nuove città.",zh:"——因为可以认识新的城市。"},
    {it:"Oh sì, ci piace tanto viaggiare in famiglia, perché ci piace vedere cose nuove e scoprire il mondo.",zh:"——哦，是的，我们一家人非常喜欢旅行，因为我们喜欢看到新鲜的事物，探索这个世界。"},
    {it:"Per me è molto importante viaggiare per conoscere i nuovi posti, e per fare conoscenza di nuove persone e anche conoscere la cultura, appunto, dei posti.",zh:"——对我来说，旅行非常重要，可以认识新的地方，也可以结识新的人，还可以了解各地的文化。"},
    {it:"Beh, sì, è importante viaggiare perché viaggiando scopri i nuovi posti, posti diversi, usanze diverse, tradizioni.",zh:"——嗯，是的，旅行很重要，因为通过旅行你会发现新的地方、不同的地方、不同的风俗和传统。"},
    {it:"Perché è importante capire i popoli, come vivono, la loro cultura e anche i posti diversi da quelli che sono da quella che è casa propria.",zh:"——因为理解其他民族、了解他们怎么生活、他们的文化，以及那些与自己家乡不同的地方，是非常重要的。"},
    {it:"Sì, per me è molto importante viaggiare perché in questo modo posso scoprire nuovi luoghi, nuove città e in questi posti anche i loro monumenti.",zh:"——是的，对我来说旅行非常重要，因为这样我可以发现新的地点、新的城市，在这些地方还可以参观他们的历史遗迹。"},
    {it:"Amo viaggiare, scoprire nuove culture, e ho sempre viaggiato da quando sono piccola e non credo di smettere mai.",zh:"——我热爱旅行，热爱发现新的文化，我从小就开始旅行，我想我永远都不会停止旅行。"},
    {it:"Allora, per me è importantissimo viaggiare perché si scoprono un sacco di nuovi posti, si incontrano persone diverse e si fa esperienza, si impara facendo pratica e sul campo. Quindi è assolutamente importante.",zh:"——对我来说旅行非常重要，因为通过旅行你可以发现很多新地方，遇见不同的人，积累经验，通过实践、亲身体验去学习。所以旅行绝对是很重要的。"},
    {it:"A me piace viaggiare perché in questo modo posso vedere dal vivo ciò che ho sempre visto in foto, ed è una cosa molto diversa, eh, perché nelle fotografie non si può vedere bene e realmente la bellezza delle cose che si vedono dal vivo.",zh:"——我喜欢旅行，因为这样我能亲眼看到那些我曾在照片里看到的景点，这是一种非常不同的体验，因为照片中是无法真正呈现那些事物的美的，只有亲眼见到才能真正感受到它们的魅力。"}
  ],
  vocab:[
    {e:"formale",m:"正式的，形式上的",d:"形容词，意为\"正式的、形式上的\"。同义词：ufficiale, formalistico。",ex:"Il colloquio di lavoro è stato molto formale.",exZh:"这次工作面试非常正式。"},
    {e:"importantissimo",m:"非常重要的（importante的最高级形式）",d:"importante（重要的）+ -issimo（最高级后缀）。同义词：fondamentale, essenziale, cruciale。",ex:"È importantissimo arrivare in orario.",exZh:"准时到达是非常重要的。"},
    {e:"altrimenti",m:"否则，不然",d:"连词，意为\"否则、不然\"。同义词：in caso contrario, diversamente。",ex:"Devi studiare, altrimenti non passerai l'esame.",exZh:"你必须学习，否则你不会通过考试。"},
    {e:"conoscere nuove città",m:"了解新城市",d:"conoscere 意为\"认识、了解\"。同义词：scoprire nuove città, esplorare città sconosciute。",ex:"Mi piace conoscere nuove città quando viaggio.",exZh:"旅行时我喜欢了解新的城市。"},
    {e:"ci piace tanto viaggiare in famiglia",m:"我们非常喜欢一家人一起旅行",d:"viaggiare 意为\"旅行\"。同义词：amiamo viaggiare con la famiglia, adoriamo i viaggi familiari。",ex:"Ci piace tanto viaggiare in famiglia durante le vacanze estive.",exZh:"我们非常喜欢在夏季假期和家人一起旅行。"},
    {e:"vedere cose nuove",m:"看新事物",d:"vedere 意为\"看\"。同义词：osservare novità, scoprire cose mai viste。",ex:"Viaggiare ti permette di vedere cose nuove ogni giorno.",exZh:"旅行让你每天都能看到新事物。"},
    {e:"scoprire il mondo",m:"探索世界",d:"scoprire 意为\"发现、探索\"；il mondo 意为\"世界\"。同义词：esplorare il pianeta, conoscere il globo。",ex:"Da bambino sognavo di scoprire il mondo.",exZh:"小时候我梦想探索世界。"},
    {e:"fare conoscenza di nuove persone",m:"结识新的人",d:"conoscenza 意为\"认识、了解\"；persone 意为\"人们\"。同义词：incontrare gente nuova, conoscere persone diverse。",ex:"Il viaggio mi ha permesso di fare conoscenza di nuove persone interessanti.",exZh:"旅行让我结识了有趣的新朋友。"},
    {e:"conoscere la cultura",m:"了解文化",d:"la cultura 意为\"文化\"。同义词：apprendere le tradizioni, comprendere usi e costumi。",ex:"Viaggiare aiuta a conoscere la cultura di diversi paesi.",exZh:"旅行有助于了解不同国家的文化。"},
    {e:"viaggiando scopri",m:"通过旅行你发现",d:"viaggiando 是 viaggiare（旅行）的动名词形式；scopri 是 scoprire（发现）的第二人称单数形式。同义词：durante i viaggi trovi, esplorando conosci。",ex:"Viaggiando scopri cose che non avresti mai immaginato.",exZh:"通过旅行，你会发现你从未想象过的事物。"},
    {e:"usanze diverse",m:"不同的习俗",d:"usanze 意为\"习俗、习惯\"；diverse 意为\"不同的、各种各样的\"。同义词：abitudini differenti, costumi vari。",ex:"Ogni paese ha usanze diverse che vale la pena conoscere.",exZh:"每个国家都有不同的习俗值得了解。"},
    {e:"tradizioni",m:"传统",d:"名词复数，意为\"传统\"。同义词：costumi, consuetudini, usi。",ex:"Le tradizioni locali riflettono la storia di un popolo.",exZh:"当地传统反映了一个民族的历史。"},
    {e:"capire i popoli",m:"理解人民",d:"capire 意为\"理解、明白\"；i popoli 意为\"人民、民族\"。同义词：comprendere le popolazioni, intendere le genti。",ex:"Viaggiare aiuta a capire i popoli e le loro culture.",exZh:"旅行有助于理解各民族及其文化。"},
    {e:"da quelli che sono da quella che è casa propria",m:"与自己家乡不同的地方",d:"casa propria 意为\"自己的家\"；da 表示\"不同于\"（= diversi da），相当于英语的 different from。同义词：le persone della propria terra, i compaesani。",ex:"È importante conoscere anche quelli che sono da quella che è casa propria.",exZh:"了解那些来自自己家乡的人也很重要。"},
    {e:"in questo modo posso vedere nuovi luoghi",m:"通过这种方式我可以看到新的地方",d:"modo 意为\"方式\"；luoghi 意为\"地方、场所\"。同义词：in questa maniera riesco a visitare posti nuovi。",ex:"In questo modo posso vedere nuovi luoghi e incontrare persone interessanti.",exZh:"通过这种方式，我可以看到新的地方并遇见有趣的人。"},
    {e:"i loro monumenti",m:"他们的纪念碑/古迹",d:"monumenti 意为\"纪念碑、古迹\"。同义词：le loro opere storiche, i loro siti archeologici。",ex:"Roma è famosa per i suoi monumenti storici.",exZh:"罗马以其历史古迹而闻名。"},
    {e:"non credo di smettere mai",m:"我认为我永远不会停止",d:"smettere 意为\"停止\"；mai 意为\"永远不\"。同义词：non penso che smetterò mai, continuerò per sempre。",ex:"Amo viaggiare così tanto che non credo di smettere mai.",exZh:"我如此热爱旅行以至于我认为我永远都不会停止。"},
    {e:"si scoprono un sacco di nuovi posti",m:"人们发现许多新的地方",d:"scoprono 是 scoprire（发现）的第三人称复数；un sacco di 意为\"很多\"。同义词：si trovano molti luoghi nuovi, si conoscono tante località diverse。",ex:"Viaggiando si scoprono un sacco di nuovi posti interessanti.",exZh:"通过旅行，人们发现许多有趣的新地方。"},
    {e:"si fa esperienza, si impara facendo pratica e sul campo",m:"人们获得经验并通过实践和实地学习",d:"si fa 意为\"人们做/获得\"；esperienza 意为\"经验\"；si impara 意为\"人们学习\"；facendo 是 fare（做）的动名词；pratica 意为\"实践\"；sul campo 意为\"在现场、实地\"。同义词：si acquisisce esperienza e si apprende con la pratica diretta。",ex:"Nella vita, si fa esperienza e si impara facendo pratica e sul campo.",exZh:"在生活中，人们通过实践和实地工作获得经验和学习。"},
    {e:"assolutamente",m:"绝对地",d:"副词，意为\"绝对地、完全地\"。同义词：totalmente, completamente, senza dubbio。",ex:"È assolutamente necessario provare la cucina locale quando si viaggia.",exZh:"旅行时尝试当地美食是绝对必要的。"},
    {e:"vedere dal vivo ciò che ho sempre visto in foto",m:"亲眼看到我一直在照片中看到的东西",d:"dal vivo 意为\"亲眼、现场\"；ciò che 意为\"……的东西\"。同义词：riesco a osservare dal vivo ciò che ho visto solo in fotografia。",ex:"Viaggiando posso vedere cose che ho sempre visto in foto ma mai dal vivo.",exZh:"通过旅行，我可以亲眼看到我一直只在照片中看到的东西。"},
    {e:"nelle fotografie non si può vedere bene e realmente la bellezza",m:"在照片中无法真正展现事物的美",d:"fotografie 意为\"照片\"；realmente 意为\"真实地\"；la bellezza 意为\"美丽\"。同义词：le immagini non catturano completamente la vera bellezza di ciò che si osserva di persona。",ex:"Nelle fotografie non si può vedere bene e realmente la bellezza delle cose che si vedono dal vivo.",exZh:"照片无法真实完全地展现亲眼所见事物的美丽。"}
  ]
},
  16: {
  zh:"我需要向你们倾诉， 因为我总能把你们当作一个忠实的朋友，尽管你们人很多。 有些日子，就像今天，我什么也做不了，我想知道你们是否也会这样？ 就是那种，早上醒来、吃完早饭，脖子这里（颈椎）有点疼，和往常一样， 因为我已经和这个颈椎痛抗争了一段时间了，很可能是因为我长年面对屏幕、面对电脑等等造成的。 最近几个月，情况越来越严重了。 嗯……我尝试过练瑜伽，但反而让情况更糟。",
  it:"ho bisogno di sfogarmi con voi. perché in voi trovo sempre un'amica fedele anche se siete tante. ci sono dei giorni come oggi in cui non riesco a fare niente e volevo sapere se succede anche a voi, cioè mi sveglio al mattino faccio colazione, un po' dolorante qui nella cervicale come al solito, perché ormai sto combattendo con questa cervicale probabilmente data dal mio stare davanti agli schermi, davanti al computer eccetera. da anni nell'ultimo negli ultimi mesi sta peggiorando. ehm ho provato a fare yoga ma mi peggiora.",
  sent:[
    {it:"ho bisogno di sfogarmi con voi.",zh:"我需要向你们倾诉，"},
    {it:"perché in voi trovo sempre un'amica fedele anche se siete tante.",zh:"因为我总能把你们当作一个忠实的朋友，尽管你们人很多。"},
    {it:"ci sono dei giorni come oggi in cui non riesco a fare niente e volevo sapere se succede anche a voi,",zh:"有些日子，就像今天，我什么也做不了，我想知道你们是否也会这样？"},
    {it:"cioè mi sveglio al mattino faccio colazione, un po' dolorante qui nella cervicale come al solito,",zh:"就是那种，早上醒来、吃完早饭，脖子这里（颈椎）有点疼，和往常一样，"},
    {it:"perché ormai sto combattendo con questa cervicale probabilmente data dal mio stare davanti agli schermi, davanti al computer eccetera.",zh:"因为我已经和这个颈椎痛抗争了一段时间了，很可能是因为我长年面对屏幕、面对电脑等等造成的。"},
    {it:"da anni nell'ultimo negli ultimi mesi sta peggiorando.",zh:"最近几个月，情况越来越严重了。"},
    {it:"ehm ho provato a fare yoga ma mi peggiora.",zh:"嗯……我尝试过练瑜伽，但反而让情况更糟。"}
  ],
  vocab:[
    {e:"sfogarmi",m:"发泄自己的情绪，倾诉，宣泄",d:"",ex:"Ho bisogno di sfogarmi con qualcuno che mi capisce.（我需要向能理解我的人倾诉。）",exZh:""},
    {e:"un'amica fedele",m:"一个忠实的女性朋友",d:"",ex:"Maria è un'amica fedele che non mi ha mai tradito.（玛丽亚是一个从未背叛过我的忠实朋友。）",exZh:""},
    {e:"anche se",m:"尽管，即使，虽然",d:"",ex:"Esco a correre anche se piove.（即使下雨我也出去跑步。）",exZh:""},
    {e:"ci sono dei giorni",m:"有些日子",d:"",ex:"Ci sono dei giorni in cui tutto sembra andare storto.（有些日子似乎一切都不顺利。）",exZh:""},
    {e:"non riesco a fare niente",m:"我什么也做不了，我无法做任何事",d:"",ex:"Quando sono depresso non riesco a fare niente di produttivo.（当我情绪低落时，我无法做任何有成效的事情。）",exZh:""},
    {e:"volevo sapere",m:"我想知道",d:"",ex:"Volevo sapere se hai tempo per un caffè domani.（我想知道你明天是否有时间喝咖啡。）",exZh:""},
    {e:"un po' dolorante",m:"有点疼痛，微微疼痛",d:"",ex:"Dopo l'allenamento mi sento un po' dolorante ai muscoli.（锻炼后我的肌肉感觉有点疼。）",exZh:""},
    {e:"cervicale",m:"颈椎，颈部的",d:"",ex:"La mia cervicale mi fa male quando sto troppo tempo al computer.（当我长时间使用电脑时，我的颈椎会疼痛。）",exZh:""},
    {e:"come al solito",m:"和往常一样，一如既往",d:"",ex:"Come al solito, è arrivato in ritardo all'appuntamento.（和往常一样，他迟到了。）",exZh:""},
    {e:"combattendo",m:"抗争，战斗",d:"",ex:"Sta combattendo contro una grave malattia.（他正在与一种严重的疾病作斗争。）",exZh:""},
    {e:"probabilmente data dal",m:"很可能是由...引起的，很可能源于",d:"",ex:"La sua stanchezza è probabilmente data dal troppo lavoro.（他的疲劳很可能是由过度工作引起的。）",exZh:""},
    {e:"davanti agli schermi",m:"在屏幕前",d:"",ex:"Passare troppe ore davanti agli schermi può danneggiare la vista.（在屏幕前花太多时间可能会损害视力。）",exZh:""},
    {e:"eccetera",m:"等等，诸如此类",d:"",ex:"Porterò libri, quaderni, penne eccetera.（我将带书、笔记本、钢笔等等。）",exZh:""},
    {e:"negli ultimi mesi",m:"在最近几个月",d:"",ex:"Negli ultimi mesi ho notato un miglioramento nella mia salute.（在最近几个月，我注意到我的健康有所改善。）",exZh:""}
  ]
},
  17: {
  zh:"为什么学会设立个人边界如此重要？这是因为我每天都会看到很多人向我倾诉他们难以与他人设立边界的困扰。我也越来越清楚地意识到，很多人的问题其实都源于不善于设立这些边界。所以今天，我想告诉你 7 件你必须知道的事，如果你想更好地设立界限： 第1件事：解决他人的问题不是你的责任，你不需要对他人负责。 第2件事：先关心自己是没错的。你应该在生活中把自己放在第一位，因为只有你自己才能真正对自己的幸福负责。 第3件事：承担他人的责任不是你的任务，你无法拯救任何人，也无法为他人的幸福负责。 第4件事：你有权力表达自己的愿望。这被称为自信表达，也被称为真实性。所谓真实，就是当你允许自己真诚地表达内心愿望的那一刻。 第5件事：没有人必须同意你的观点，你来到这个世界不是为了让他人同意你的选择，你来到这个世界是为了找到自己的道路，找到使你平静、快乐的东西，所以你不必担心他人是否同意你的观点。 第6件事：你是自己幸福的唯一负责人。请牢牢记住，只有你，通过每天的选择和决定，才能真正为自己的幸福负责。 最后，第7件事：这是你的权利说\"不\"。并不是说你必须永远说\"是\"。勇于说\"不\"意味着你敢于承担责任表达不同意他人的立场，因为有时候我们不可能与他人意见一致。你有自己的思想你有自己的观点你有自己的需求，所以说\"不\"完全是你神圣的权利。",
  it:"perché è tanto importante imparare a mettere i confini? perché lo vedo ogni giorno, molte persone che mi raccontano la difficoltà che hanno a mettere i confini con gli altri. e mi accorgo sempre di più di come molti dei problemi delle persone dipendono dalla fatica a mettere questi confini. allora oggi voglio raccontarti 7 cose che devi sapere se vuoi mettere più confini: cosa numero 1: sistemare le cose altrui non spetta a te. tu non sei responsabile degli altri. cosa da sapere numero 2: va bene prenderti cura prima di te stesso. tu devi essere la tua priorità nella tua vita. perché solo tu puoi essere il responsabile di prenderti cura di te. cosa numero 3：non è compito tuo assumerti la responsabilità degli altri, tu non puoi salvare nessuno. non puoi essere il responsabile della felicità degli altri. cosa numero 4: hai il diritto di esprimere i tuoi desideri. questo si chiama assertività e si chiama anche autenticità, cioè, è autentico nel momento in cui ti dà il permesso di esprimere autenticamente appunto i tuoi desideri. cosa numero 5: nessuno deve essere d'accordo con te, tu non sei venuto al mondo affinché gli altri siano d'accordo con le tue scelte. tu sei venuto al mondo per trovare la tua strada, per trovare ciò che ti rende sereno felice. Quindi non ti devi occupare del fatto che gli altri siano d'accordo con te. cosa numero 6: sei tu il responsabile della tua felicità. ricordatelo bene, solo tu, con le tue scelte e le tue decisioni quotidiane, sei responsabile della tua felicità. infine cosa da sapere numero 7：è un tuo diritto dire di no. non è vero che bisogna sempre dire sì. dire il no significa assumerti la responsabilità di non essere d'accordo con gli altri. perché a volte non siamo d'accordo con gli altri. Hai la tua testa Hai le tue opinioni Hai i tuoi bisogni, quindi dire no è tuo sacrosanto diritto.",
  sent:[
    {it:"perché è tanto importante imparare a mettere i confini? perché lo vedo ogni giorno, molte persone che mi raccontano la difficoltà che hanno a mettere i confini con gli altri. e mi accorgo sempre di più di come molti dei problemi delle persone dipendono dalla fatica a mettere questi confini. allora oggi voglio raccontarti 7 cose che devi sapere se vuoi mettere più confini:",zh:"为什么学会设立个人边界如此重要？这是因为我每天都会看到很多人向我倾诉他们难以与他人设立边界的困扰。我也越来越清楚地意识到，很多人的问题其实都源于不善于设立这些边界。所以今天，我想告诉你 7 件你必须知道的事，如果你想更好地设立界限："},
    {it:"cosa numero 1: sistemare le cose altrui non spetta a te. tu non sei responsabile degli altri.",zh:"第1件事：解决他人的问题不是你的责任，你不需要对他人负责。"},
    {it:"cosa da sapere numero 2: va bene prenderti cura prima di te stesso. tu devi essere la tua priorità nella tua vita. perché solo tu puoi essere il responsabile di prenderti cura di te.",zh:"第2件事：先关心自己是没错的。你应该在生活中把自己放在第一位，因为只有你自己才能真正对自己的幸福负责。"},
    {it:"cosa numero 3：non è compito tuo assumerti la responsabilità degli altri, tu non puoi salvare nessuno. non puoi essere il responsabile della felicità degli altri.",zh:"第3件事：承担他人的责任不是你的任务，你无法拯救任何人，也无法为他人的幸福负责。"},
    {it:"cosa numero 4: hai il diritto di esprimere i tuoi desideri. questo si chiama assertività e si chiama anche autenticità, cioè, è autentico nel momento in cui ti dà il permesso di esprimere autenticamente appunto i tuoi desideri.",zh:"第4件事：你有权力表达自己的愿望。这被称为自信表达，也被称为真实性。所谓真实，就是当你允许自己真诚地表达内心愿望的那一刻。"},
    {it:"cosa numero 5: nessuno deve essere d'accordo con te, tu non sei venuto al mondo affinché gli altri siano d'accordo con le tue scelte. tu sei venuto al mondo per trovare la tua strada, per trovare ciò che ti rende sereno felice. Quindi non ti devi occupare del fatto che gli altri siano d'accordo con te.",zh:"第5件事：没有人必须同意你的观点，你来到这个世界不是为了让他人同意你的选择，你来到这个世界是为了找到自己的道路，找到使你平静、快乐的东西，所以你不必担心他人是否同意你的观点。"},
    {it:"cosa numero 6: sei tu il responsabile della tua felicità. ricordatelo bene, solo tu, con le tue scelte e le tue decisioni quotidiane, sei responsabile della tua felicità.",zh:"第6件事：你是自己幸福的唯一负责人。请牢牢记住，只有你，通过每天的选择和决定，才能真正为自己的幸福负责。"},
    {it:"infine cosa da sapere numero 7：è un tuo diritto dire di no. non è vero che bisogna sempre dire sì. dire il no significa assumerti la responsabilità di non essere d'accordo con gli altri. perché a volte non siamo d'accordo con gli altri. Hai la tua testa Hai le tue opinioni Hai i tuoi bisogni, quindi dire no è tuo sacrosanto diritto.",zh:"最后，第7件事：这是你的权利说\"不\"。并不是说你必须永远说\"是\"。勇于说\"不\"意味着你敢于承担责任表达不同意他人的立场，因为有时候我们不可能与他人意见一致。你有自己的思想你有自己的观点你有自己的需求，所以说\"不\"完全是你神圣的权利。"}
  ],
  vocab:[
    {e:"tanto importante",m:"非常重要",d:"\"tanto\"作为强调副词，增强了\"importante\"的程度。 同义词：molto significativo, estremamente rilevante, di grande importanza",ex:"È tanto importante parlare apertamente dei tuoi sentimenti.",exZh:"公开谈论你的感受是非常重要的。"},
    {e:"mettere i confini",m:"设立界限，划定边界",d:"mettere: 放置，设立 同义词：stabilire limiti, definire barriere, fissare demarcazioni",ex:"Devi mettere i confini chiari nelle tue relazioni personali.",exZh:"你必须在你的人际关系中设立清晰的界限。"},
    {e:"vedo ogni giorno",m:"每天看到",d:"vedo: 我看到（动词vedere的第一人称单数现在时） 同义词：osservo quotidianamente, noto giornalmente",ex:"Vedo ogni giorno nuovi progressi nel suo apprendimento.",exZh:"我每天都看到他学习上的新进步。"},
    {e:"mi accorgo sempre di più",m:"我越来越意识到",d:"mi accorgo: 我意识到（动词accorgersi的第一人称单数现在时） 同义词：realizzo sempre maggiormente, prendo sempre più coscienza",ex:"Mi accorgo sempre di più dell'importanza di una buona educazione.",exZh:"我越来越意识到良好教育的重要性。"},
    {e:"problemi",m:"问题",d:"同义词：difficoltà, complicazioni, ostacoli",ex:"I problemi familiari possono influenzare il rendimento scolastico.",exZh:"家庭问题可能会影响学习成绩。"},
    {e:"dipendono da",m:"取决于，依赖于",d:"dipendono: 他们依赖（动词dipendere的第三人称复数现在时） 同义词：sono condizionati da, sono influenzati da, derivano da",ex:"I risultati dell'esame dipendono dalla tua preparazione.",exZh:"考试结果取决于你的准备。"},
    {e:"voglio raccontarti",m:"我想告诉你",d:"voglio: 我想要（动词volere的第一人称单数现在时） 同义词：desidero dirti, intendo spiegarti",ex:"Voglio raccontarti una storia che mi è successa ieri.",exZh:"我想告诉你昨天发生在我身上的一个故事。"},
    {e:"se vuoi mettere più confini",m:"如果你想设立更多界限",d:"同义词：se desideri stabilire maggiori limiti, qualora tu voglia definire più barriere",ex:"Se vuoi mettere più confini nella tua vita professionale, devi imparare a dire di no.",exZh:"如果你想在职业生活中设立更多界限，你必须学会说不。"},
    {e:"sistemare",m:"解决，整理，安排",d:"同义词：risolvere, ordinare, aggiustare",ex:"Devo sistemare tutti i documenti prima della revisione.",exZh:"在审查之前我必须整理好所有文件。"},
    {e:"altrui",m:"他人的，别人的",d:"同义词：degli altri, delle altre persone",ex:"Rispetta sempre i sentimenti altrui.",exZh:"永远尊重他人的感受。"},
    {e:"non sei responsabile degli altri",m:"你不对他人负责",d:"同义词：non hai l'obbligo di rispondere per gli altri, non devi farti carico degli altri",ex:"Ricorda che non sei responsabile degli altri e delle loro scelte.",exZh:"记住，你不对他人及其选择负责。"},
    {e:"prenderti cura",m:"照顾自己，关心",d:"同义词：occuparti, avere attenzione per te stesso",ex:"È importante prenderti cura della tua salute mentale.",exZh:"关心你的心理健康很重要。"},
    {e:"te stesso",m:"你自己",d:"te: 你（强调形式） 同义词：la tua persona, il tuo io",ex:"Devi avere più fiducia in te stesso.",exZh:"你必须对自己有更多信心。"},
    {e:"priorità",m:"优先事项，优先",d:"同义词：cosa principale, elemento più importante",ex:"La salute dovrebbe essere la tua priorità assoluta.",exZh:"健康应该是你的绝对优先事项。"},
    {e:"responsabile",m:"负责人，负责任的",d:"可以作为名词或形容词使用，在这里作为名词，指的是对某事承担责任的人。 同义词：incaricato, colui che risponde, persona che ha la responsabilità",ex:"Sei responsabile delle tue azioni e delle loro conseguenze.",exZh:"你对自己的行为及其后果负责。"},
    {e:"non è compito tuo",m:"不是你的任务",d:"",ex:"",exZh:""},
    {e:"diritto",m:"",d:"",ex:"",exZh:""},
    {e:"affinché",m:"以便、为了",d:"同义词：perché, allo scopo che, in modo che, cosicché",ex:"Studio molto affinché io possa superare l'esame.",exZh:"我努力学习以便能通过考试。"},

    {e:"trovare la tua strada",m:"寻找你的道路",d:"",ex:"",exZh:""},
    {e:"ti rende",m:"使你变得、让你成为",d:"",ex:"Questo lavoro ti rende stressato.",exZh:"这项工作使你感到压力。"},
    {e:"non ti devi occupare",m:"你不必担心",d:"",ex:"",exZh:""},
    {e:"sei tu il responsabile della tua felicità",m:"你是你幸福的负责人",d:"",ex:"",exZh:""},
    {e:"ricordatelo bene",m:"好好记住这一点",d:"",ex:"",exZh:""},
    {e:"decisioni quotidiane",m:"日常决定",d:"",ex:"",exZh:""},
    {e:"è un tuo diritto dire di no",m:"说\"不\"是你的权利",d:"",ex:"",exZh:""},
    {e:"assumerti la responsabilità",m:"承担责任",d:"",ex:"",exZh:""},

    {e:"opinioni",m:"观点、意见",d:"",ex:"",exZh:""},

  18: {
  zh:"你是做什么工作的？ 我教小学生各种科目。 我是保姆。 我在餐厅当服务员。 我做消防系统方面的工作。 你是做什么工作的？ 我是咖啡师。 我在一家化工公司负责采购。 我在一家银行机构负责采购。 大家好，我从事筹款方面的工作，也就是募捐。 我不工作，我在上大学。 你学什么专业？ 我学的是政治学。 我在咨询行业工作，在米兰的一家公司做人力资源相关的工作。",
  it:"Che lavoro fai? Insegno varie materie ai bambini delle elementari. Sono la babysitter. Lavoro come cameriera. Faccio gli impianti antincendio. Che lavoro fai? Sono la barista. Mi occupo di acquisti in un'azienda chimica. Mi occupo di acquisti in un istituto bancario. Ciao a tutti, io lavoro nell'ambito del fundraising, quindi la raccolta fondi. Non lavoro, ma studio all'università. Che cosa studi? Studio scienze politiche. Io lavoro in consulenza, mi occupo di risorse umane in un'azienda qui a Milano.",

19:{zh:'你在哪里工作？',it:'Dove lavori?',sent:[{it:'Dove lavori?',zh:'你在哪里工作？'},{it:'-- A casa mia o a casa delle altre persone.',zh:'——在我家，或者在别人的家里。'},{it:'-- In un ristorante.',zh:'——在一家餐厅。'},{it:'-- In una scuola elementare.',zh:'——在一所小学。'},{it:'-- In campo, in giro per gli stabilimenti.',zh:'——在户外，四处跑，去不同的工厂。'},{it:'-- Dove lavori?',zh:'你在哪里工作？'},{it:'-- In un outlet.',zh:'——在一家奥特莱斯（折扣商场）。'},{it:'-- lavoro in provincia di Milano, quindi non è Milano Centro, ma è a nord-ovest di Milano.',zh:'——我在米兰省工作，所以不是在米兰市中心，而是在米兰西北部。'},{it:'-- A Milano, in pieno centro.',zh:'——在米兰，就在市中心。'},{it:'In una banca?',zh:'是在银行吗？'},{it:'-- Sì, in una banca.',zh:'——是的，在一家银行。'},{it:'-- lavoro in un ufficio.',zh:'——我在办公室工作。'},{it:'-- lavoro qui, a Milano, qua dietro.',zh:'——我在米兰工作，就在这附近。'}],vocab:[{e:'a casa delle altre persone',m:'在别人家',d:'a casa = 在家；delle altre persone = 其他人的',ex:'Quando vado a casa delle altre persone, porto sempre un piccolo regalo.',exZh:'当我去别人家时，我总是带一个小礼物。'},{e:'scuola elementare',m:'小学',d:'scuola = 学校；elementare = 基础的，初等的',ex:'Mia figlia frequenta la scuola elementare vicino a casa.',exZh:'我女儿在附近的小学上学。'},{e:'in campo',m:'在现场，在户外',d:'campo = 场地，田野；in campo 指在工作现场或户外',ex:'Gli ingegneri lavorano in campo per risolvere i problemi tecnici.',exZh:'工程师们在现场工作解决技术问题。'},{e:'in giro per',m:'到处，四处',d:'in giro = 转悠，四处走动；per = 通过，为了',ex:'Sono in giro per la città tutto il giorno.',exZh:'我一整天都在城里四处跑。'},{e:'stabilimenti',m:'工厂，企业，设施',d:'同义词：fabbriche, impianti, aziende',ex:'Visitiamo regolarmente gli stabilimenti per controllare la qualità.',exZh:'我们定期访问工厂检查生产质量。'},{e:'un outlet',m:'奥特莱斯，折扣商场',d:'销售品牌商品的折扣商场；同义词：centro commerciale di sconti',ex:'All\'outlet ho trovato una giacca di marca a metà prezzo.',exZh:'在奥特莱斯我找到了一件半价的名牌夹克。'},{e:'in provincia di Milano',m:'在米兰省',d:'provincia = 省，县；指米兰周边地区',ex:'Molte aziende tecnologiche hanno sede in provincia di Milano.',exZh:'许多科技公司总部位于米兰省。'},{e:'a nord-ovest di',m:'在...的西北部',d:'nord-ovest = 西北；di = 的',ex:'La città si trova a nord-ovest di Roma.',exZh:'这座城市位于罗马的西北部。'},{e:'in pieno centro',m:'在正市中心',d:'pieno = 完全的，正中的；pieno centro = 市中心最核心区域',ex:'Il negozio è in pieno centro, vicino al duomo.',exZh:'商店在正市中心，靠近大教堂。'},{e:'banca',m:'银行',d:'同义词：istituto di credito, istituto bancario',ex:'Devo andare in banca per aprire un nuovo conto.',exZh:'我需要去银行开一个新账户。'},{e:'ufficio',m:'办公室',d:'同义词：studio, locale di lavoro, sede lavorativa',ex:'Il mio ufficio si trova al terzo piano dell\'edificio.',exZh:'我的办公室在大楼的三楼。'},{e:'qua dietro',m:'在这附近，就在后面',d:'qua = 这里；dietro = 后面；表示位置很近',ex:'Il ristorante è qua dietro, a due minuti a piedi.',exZh:'餐厅就在这附近，步行两分钟。'}]},
20:{zh:'这是一道能温暖人心的美食!',it:'Un piatto che scalda il cuore',sent:[{it:'Un paio di settimane fa sono andata a Bologna per un fine settimana insieme a degli amici per assistere ad un evento sportivo.',zh:'几周前，我和一些朋友一起去了博洛尼亚，度过了一个周末，去看一场体育赛事。'},{it:'Abbiamo viaggiato in treno, per me la scelta più comoda e veloce.',zh:'我们选择了乘坐火车出行，对我来说这是最方便快捷的方式。'},{it:'Da Roma si arriva a Bologna in due ore e un quarto circa con un treno ad alta velocità.',zh:'从罗马出发，搭乘高速列车大约两个小时十五分钟就能到达博洛尼亚。'},{it:'Siamo arrivati adesso, stiamo aspettando due nostri amici con cui dobbiamo andare insieme all\'albergo.',zh:'我们现在已经到了，正在等另外两个朋友，接下来我们要一起去酒店。'},{it:'Una volta arrivati in città, siamo andati a ritirare la macchina a noleggio e ci siamo diretti verso l\'albergo.',zh:'到达城市后，我们先去取了租来的车，然后直接开车前往酒店。'},{it:'Abbiamo soggiornato un po\' fuori Bologna, perciò non siamo riusciti a visitare la città.',zh:'我们住的地方在博洛尼亚郊外一些，所以没能参观市区。'},{it:'Comunque non è mancato il tempo per mangiare!',zh:'不过呢，吃饭的时间是肯定不会少的！'},{it:'Abbiamo mangiato benissimo, come di consueto in questa zona.',zh:'我们吃得非常好，在这个地区，一如既往地吃得非常好。'},{it:'Sullo schermo vedete alcuni piatti che mi sono gustata.',zh:'你们现在在屏幕上看到的是我品尝的一些菜肴。'},{it:'Se dovete ricordare un solo piatto tra questi senza dubbio, vi dico di segnarvi i tortellini in brodo.',zh:'如果你只能记住其中一道菜，那毫无疑问，我推荐你记下清汤饺子。'},{it:'Sono un piatto che scalda il cuore!',zh:'这是一道能温暖人心的美食！'}],vocab:[{e:'assistere ad un evento sportivo',m:'参加/观看体育赛事',d:'动词assistere意为出席、参加',ex:'Ogni anno assistiamo alla maratona cittadina.',exZh:'每年我们都参加城市马拉松。'},{e:'comoda e veloce',m:'方便且快速的',d:'形容出行方式便捷',ex:'Il treno è sempre la soluzione più comoda e veloce.',exZh:'火车总是最方便快捷的出行方式。'},{e:'treno ad alta velocità',m:'高速列车',d:'意大利的快速铁路系统',ex:'L\'alta velocità collega tutte le principali città italiane.',exZh:'高速列车连接了所有主要的意大利城市。'},{e:'macchina a noleggio',m:'租车',d:'租赁的汽车',ex:'In vacanza, preferisco sempre una macchina a noleggio.',exZh:'度假时，我总是更喜欢租车。'},{e:'diretti',m:'前往',d:'dirigere的过去分词，有明确目的地行进',ex:'Ci siamo diretti verso il ristorante per la cena.',exZh:'我们直接前往餐厅用晚餐。'},{e:'fuori Bologna',m:'在博洛尼亚郊外',d:'在城市外部/郊区',ex:'Abito fuori Bologna, ma lavoro in centro.',exZh:'我住在博洛尼亚郊外，但在市中心工作。'},{e:'non siamo riusciti a',m:'我们没能够',d:'non+essere riusciti+a+不定式，委婉表达未能成功',ex:'Non siamo riusciti a trovare il ristorante.',exZh:'我们没能找到那家餐厅。'},{e:'Comunque',m:'无论如何/不管怎样',d:'表示转折或强调的连接词',ex:'Comunque vada, farò del mio meglio.',exZh:'不管怎样，我都会尽我最大的努力。'},{e:'non è mancato il tempo per mangiare',m:'吃饭的时间绝对没有少',d:'字面否定实际肯定，mancare的否定形式',ex:'Non è mancata la voglia di divertirsi!',exZh:'玩乐的兴致绝对不会少！'},{e:'come di consueto',m:'像往常一样',d:'consuere的过去分词，与come连用',ex:'Come di consueto, la domenica pranziamo tutti insieme.',exZh:'像往常一样，周日我们一起用午餐。'},{e:'tortellini in brodo',m:'清汤饺子',d:'brodo汤，in brodo用汤煮',ex:'A Bologna, i tortellini in brodo sono un piatto tradizionale.',exZh:'在博洛尼亚，清汤饺子是一道传统菜肴。'},{e:'che scalda il cuore',m:'温暖人心的',d:'形容食物或事物令人感到温暖',ex:'Una minestra calda è un piatto che scalda il cuore.',exZh:'一碗热汤是能温暖人心的。'}]},
21:{zh:'我常常会有那种可以做很多事情的感觉',it:'Mi sento di poter fare mille cose',sent:[{it:'oggi è venerdì pomeriggio e sono praticamente iniziate le vacanze di Pasqua, perché domenica che viene è Pasqua.',zh:'今天是周五下午，复活节假期基本已经开始了，因为这个星期天就是复活节。'},{it:'E quindi c\'è un ponte lungo, quindi le scuole sono chiuse oggi e saranno chiuse anche lunedì.',zh:'所以这次是个小长假，学校今天开始放假，星期一也放假。'},{it:'Perché per noi lunedì è Pasquetta, Lunedì dell\'Angelo ed è festa anche lunedì.',zh:'因为对我们来说，星期一是小复活节，也叫天使星期一，所以星期一也是假日。'},{it:'Quindi oggi mi sono presa mezza giornata libera per fare dei giri in centro e niente.',zh:'今天我请了半天假，打算去市中心逛逛，差不多就这样。'},{it:'Non lo so, il venerdì pomeriggio mi dà quella sensazione di mille possibilità, non so come spiegare questa cosa.',zh:'我也说不上来，周五下午总会给我一种充满无限可能的感觉，我不知道怎么解释这种感觉。'},{it:'Sapete quando avete finito di lavorare il venerdì, è finita la settimana di lavoro e adesso avete un po\' di tempo libero a disposizione per voi, se avete il fine settimana libero.',zh:'你们知道那种下班后的状态吗？就是星期五工作结束了，一周的忙碌终于结束了，如果你的周末是空闲的，那你就会突然有一段属于自己的自由时间。'},{it:'E quindi io spesso ho quella sensazione di poter fare mille cose, quella sensazione di avere davanti a sé mille possibilità, non so come spiegare questa cosa, comunque!',zh:'所以我常常会有那种可以做很多事情的感觉，一种眼前有无限可能的感觉。我不知道怎么才能好好地解释清楚这种感觉，但总之就是这样啦！'}],vocab:[{e:'Praticamente',m:'实际上/基本上',d:'副词，表示几乎、差不多',ex:'Praticamente sono già laureato.',exZh:'我基本上已经毕业了。'},{e:'le vacanze di Pasqua',m:'复活节假期',d:'vacanza假期，Pasqua复活节',ex:'Ogni anno trascorriamo le vacanze di Pasqua in famiglia.',exZh:'每年我们都和家人一起度过复活节假期。'},{e:'ponte lungo',m:'长假/长周末',d:'ponte桥梁，引申为连接两个假期的额外休息日',ex:'Approfittiamo del ponte lungo per fare un viaggio.',exZh:'我们利用长假去旅行。'},{e:'mi sono presa mezza giornata libera',m:'我请了半天假',d:'prendersi给自己时间，自主安排',ex:'Mi sono presa mezza giornata libera per andare dal dottore.',exZh:'我请了半天假去看医生。'},{e:'sensazione di mille possibilità',m:'充满无限可能的感觉',d:'sensazione感觉，possibilità可能性',ex:'Il venerdì mi dà sempre la sensazione di mille possibilità.',exZh:'周五总是给我无限可能的感觉。'},{e:'finito di lavorare',m:'结束工作',d:'完成工作，下班',ex:'Appena finito di lavorare, vado in palestra.',exZh:'一结束工作，我就去健身房。'},{e:'tempo libero a disposizione',m:'可支配的自由时间',d:'a disposizione可用的，可支配的',ex:'Nel mio tempo libero a disposizione, mi piace leggere.',exZh:'在我可支配的自由时间里，我喜欢阅读。'},{e:'davanti a sé',m:'在自己面前',d:'davanti在前面，sé自己',ex:'Lui ha messo il libro davanti a sé.',exZh:'他把书放在自己面前。'}]},22:{zh:'你多大了？',it:'Quanti anni hai?',sent:[{'it':'La domanda di oggi è quanti anni hai o formale quanti anni ha.','zh':'今天的问题是：你几岁了？或者用正式语气说：您几岁了？'},{'it':'va bene ascoltiamo le risposte della gente.','zh':'好啦，我们来听听大家怎么回答。'},{'it':'ho ventisei anni.','zh':'我26岁。'},{'it':'ho quarantotto anni.','zh':'我48岁。'},{'it':'io ho venticinque anni.','zh':'我25岁。'},{'it':'io ne ho io ho quarantasei anni.','zh':'我……我46岁。'},{'it':'ho ventisei anni.','zh':'我26岁。'},{'it':'ho cinquantatre, quasi cinquantaquattro anni.','zh':'我53岁，快54了。'},{'it':'ne ho trentadue.','zh':'我32岁。'},{'it':'ho ventitre anni.','zh':'我23岁。'},{'it':'settanta, purtroppo.','zh':'70岁了，哎，年纪不小了。'},{'it':'ho trentatre anni.','zh':'我33岁。'},{'it':'diciassette.','zh':'17岁。'},{'it':'E io ne ho da poco compiuti ventidue.','zh':'我刚满22岁。'},{'it':'Ho ventidue anni.','zh':'我22岁。'},{'it':'sono nata il ventitre dicembre del novantasei.','zh':'1996年12月23日出生。'},{'it':'ne ho appena fatti diciassette.','zh':'我刚满17岁。'},{'it':'Anch\'io ne ho appena fatti diciassette.','zh':'我也是刚满17岁。'},{'it':'Ho dodici anni, ma fra quindici giorni ne compio tredici.','zh':'我12岁了，不过再过15天我就13岁了。'},{'it':'Io invece ne ho solo dodici.','zh':'我只有12岁。'},{'it':'Non dovrei dirlo, ne ho già sessantacinque.','zh':'我不该说的，但我已经65岁了。'},{'it':'A una donna non si chiede, però sessanta.','zh':'女人的年龄不该问啦，不过……60岁。'},{'it':'E lei un anno e mezzo.','zh':'她呢？一岁半。'},{'it':'quarantatre e mezzo.','zh':'43岁半。'},{'it':'quarantaquattro a luglio.','zh':'7月就44了。'},{'it':'Io ho quarantatre anni e Pietro ne ha tre, quasi e mezzo.','zh':'我43岁，皮耶特罗快3岁半了。'}],vocab:[{"e": "quanti anni hai", "m": "
