/* ============ 状态 ============ */
const UNLOCK_CODE='RA26-2026', FREE_UNTIL=1, UNLOCK_KEY='vl_unlocked2', SK_KEY='vl_steps_';
let view='home', curEp=null, curIdx=0, curAudio=null, curAudioKind='audio', curPlayingN=null, autoAdvance=true;

/* 全局媒体池：任何视图切换时停止所有正在播放的音频/视频/TTS，避免跨页音频残留与重叠 */
const __mediaPool=new Set();
function trackMedia(m){ if(m&&typeof m.pause==='function'){ __mediaPool.add(m); } return m; }
function stopAllGlobal(){
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  __mediaPool.forEach(m=>{ try{ if(!m.paused) m.pause(); }catch(e){} });
  document.querySelectorAll('audio,video').forEach(m=>{ try{ if(!m.paused) m.pause(); }catch(e){} });
}

function isUnlocked(){ try{return localStorage.getItem(UNLOCK_KEY)==='1';}catch(e){return false;} }
function svUn(){ try{localStorage.setItem(UNLOCK_KEY,'1');}catch(e){} }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); }
function stars(n){ return '★'.repeat(n); }
const playIcon='▶', pauseIcon='⏸';

/* ============ 迷你播放器 ============ */
function ensureMini(){
  let mp=document.getElementById('miniPlayer');
  if(!mp.querySelector('.mp-badge')) mp.innerHTML=`
    <span class="mp-badge">ITALIANO</span>
    <span class="mp-title" id="mpTitle">—</span>
    <button class="mp-play" id="mpPlay">▶</button>
    <div class="mp-progress" id="mpProg"><i id="mpBar"></i></div>
    <span class="mp-time" id="mpTime">0:00</span>
    <button class="mp-close" id="mpClose">✕</button>`;
  return mp;
}
function bindMiniPlayer(audio, label, kind){
  const mp=ensureMini();
  mp.classList.remove('hidden');
  mp.querySelector('#mpTitle').textContent=label;
  const playBtn=mp.querySelector('#mpPlay');
  const setIcon=()=>{ playBtn.innerHTML = audio.paused ? playIcon : pauseIcon; };
  const upd=()=>{ if(!audio.duration)return; mp.querySelector('#mpBar').style.width=(audio.currentTime/audio.duration*100)+'%'; mp.querySelector('#mpTime').textContent=fmtT(audio.currentTime)+' / '+fmtT(audio.duration); };
  if(mp.__audio!==audio){ audio.addEventListener('play',setIcon); audio.addEventListener('pause',setIcon); audio.addEventListener('timeupdate',upd); audio.addEventListener('ended',setIcon); mp.__audio=audio; }
  playBtn.onclick=()=>{ if(audio.paused){audio.play();}else{audio.pause();} };
  mp.querySelector('#mpClose').onclick=()=>{ try{audio.pause();}catch(e){} if(curAudio===audio)curAudio=null; mp.classList.add('hidden'); };
  setIcon(); upd();
  // 迷你播放器进度条：点击/拖拽跳转
  mp.__media=audio;
  const mpProg=mp.querySelector('#mpProg');
  if(!mp.__seekBound){
    mp.__seek=false;
    function seekMiniBy(e){ const m=mp.__media; if(!m||!m.duration)return; const r=mpProg.getBoundingClientRect(); const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); try{ m.currentTime=ratio*m.duration; }catch(_){} }
    mpProg.addEventListener('pointerdown',e=>{ mp.__seek=true; try{mpProg.setPointerCapture(e.pointerId);}catch(_){} seekMiniBy(e); });
    mpProg.addEventListener('pointermove',e=>{ if(mp.__seek)seekMiniBy(e); });
    mpProg.addEventListener('pointerup',()=>{ mp.__seek=false; });
    mpProg.addEventListener('pointercancel',()=>{ mp.__seek=false; });
    mp.__seekBound=true;
  }
}
function fmtT(s){ if(!isFinite(s))return '0:00'; const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); }
function hideMini(){ ensureMini().classList.add('hidden'); }

function applyFilter(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const f=document.querySelector('#toolbar .chip.on')?.dataset.f||'all';
  document.querySelectorAll('.ep-card').forEach(card=>{
    const ep=EPS.find(e=>e.n===Number(card.dataset.ep));
    const okT=f==='all'||ep.theme===f;
    const okQ=!q||(ep.title+ep.theme+ep.blog+ep.n+'').toLowerCase().includes(q);
    card.style.display=(okT&&okQ)?'':'none';
  });
}

/* ============ 解锁 ============ */
let unlockTarget=null;
function openUnlock(ep){ unlockTarget=ep||1; document.getElementById('umCode').value=''; document.getElementById('umErr').textContent=''; document.getElementById('umodal').classList.remove('hidden'); document.getElementById('umCode').focus(); }
document.getElementById('umClose').onclick=()=>{ document.getElementById('umodal').classList.add('hidden'); };
document.querySelector('.um-mask').onclick=()=>{ document.getElementById('umodal').classList.add('hidden'); };
document.getElementById('umGo').onclick=()=>{
  const v=document.getElementById('umCode').value.trim().toUpperCase();
  if(v===UNLOCK_CODE){ svUn(); document.getElementById('umodal').classList.add('hidden'); toast('🎉 解锁成功！全部课程已开放～'); }
  else { document.getElementById('umErr').textContent='❌ 激活码不正确，请检查后重试'; }
};
document.getElementById('umCode').addEventListener('keydown',e=>{ if(e.key==='Enter')document.getElementById('umGo').click(); });

/* ============ 视图切换通用 ============ */
function renderTopbar(ep, modeLabel, modeTarget, modeTitle){
  const tbL=document.getElementById('topbar').querySelector('.tb-left');
  const tbR=document.getElementById('topbar').querySelector('.tb-right');
  const readyEps=EPS.filter(e=>e.st!=='soon').map(e=>e.n).sort((a,b)=>a-b);
  const curIdx=readyEps.indexOf(ep.n);
  const prevN=curIdx>0?readyEps[curIdx-1]:null;
  const nextN=curIdx>=0&&curIdx<readyEps.length-1?readyEps[curIdx+1]:null;
  const prevBtn=prevN?`<a class="tb-nav" id="tbPrev" title="上一期">‹</a>`:`<a class="tb-nav tb-nav-disabled" title="已经是第一期">‹</a>`;
  const nextBtn=nextN?`<a class="tb-nav" id="tbNext" title="下一期">›</a>`:`<a class="tb-nav tb-nav-disabled" title="已经是最后一期">›</a>`;
  tbL.innerHTML=`<a class="tb-back" id="tbBack">← 目录</a>${prevBtn}${nextBtn}`;
  document.getElementById('tbBack').onclick=()=>viewHome();
  if(prevN)document.getElementById('tbPrev').onclick=()=>goEp(prevN);
  if(nextN)document.getElementById('tbNext').onclick=()=>goEp(nextN);
  tbR.innerHTML=`<a class="tb-back" id="tbMode">${modeLabel} ${modeTitle}</a>`;
  const tgt=modeTarget==='listen'?()=>openListen(ep.n):()=>openListenAll(ep.n);
  document.getElementById('tbMode').onclick=tgt;
  document.getElementById('floatBack').style.display='flex';
  document.getElementById('floatBack').onclick=()=>viewHome();
}
function goEp(n){
  stopAllGlobal();
  if(view==='listen-all'){openListenAll(n);}
  else{openListen(n);}
}
function epHeader(ep, showModeSwitch){
  const th=THEMES[ep.theme]||{e:'📖',c:'#1e6f5c'};
  const unlocked=isUnlocked();
  const stTag=ep.st==='free'?`<span style="background:rgba(110,116,67,.12);color:var(--olive-deep);border:1px solid rgba(110,116,67,.28);padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:600;">🎁 免费试听</span>`
    :(unlocked?`<span style="background:rgba(110,116,67,.12);color:var(--olive-deep);border:1px solid rgba(110,116,67,.28);padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:600;">🔓 已解锁</span>`:`<span style="background:rgba(180,88,46,.1);color:var(--terracotta-deep);border:1px solid rgba(180,88,46,.28);padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:600;">🔒 需激活码</span>`);
  return `<div class="ep-hero">
    <span class="kicker">${th.e} EPISODIO ${String(ep.n).padStart(2,'0')} · ${esc(ep.theme)}</span>
    <h1 class="serif">${esc(ep.title)}</h1>
    <div class="sub"><em>${esc(ep.it)}</em> &nbsp;·&nbsp; 难度 ${stars(ep.diff)} &nbsp;·&nbsp; ${esc(ep.blog)} &nbsp;·&nbsp; ⏱ ${ep.dur} &nbsp; ${stTag}</div>
  </div>`;
}

/* ============ 视图：泛听（视频） ============ */
function openListenAll(n){
  stopAllGlobal();
  const ep=EPS.find(e=>e.n===n); if(!ep)return;
  if(ep.st==='soon'){ toast('🛠️ 该期内容制作中，敬请期待～'); return; }
  if(ep.st==='lock' && !isUnlocked()){ openUnlock(n); return; }
  view='listen-all'; curEp=n; curAudioKind='video';
  renderTopbar(ep,'🎧','listen','切到精听');
  const L=LESSONS[n]||{zh:'',it:'',sent:[],vocab:[]};
  const lines=(L.sent&&L.sent.length?L.sent:[{it:L.it,zh:L.zh}]);
  const lineHtml=lines.map((s,i)=>`
    <div class="all-line" data-i="${i}" data-txt="${escJs(s.it)}">
      <span class="ln-no">${String(i+1).padStart(2,'0')}</span>
      <div class="ln-body"><div class="ln-it">${esc(s.it)}</div><div class="ln-zh">${esc(s.zh)}</div></div>
      <button class="ln-play">▶</button>
    </div>`).join('');
  document.getElementById('app').innerHTML=`
    ${epHeader(ep)}
    <div class="listen-all-card">
      <div class="video-box">
        <video id="pv" controls playsinline preload="metadata" src="media/ep${n}.mp4" preload="auto"></video>
      </div>
      <div class="all-player">
        <button class="big-play" id="allPlayBtn">${playIcon}</button>
        <div class="progress" id="allProg"><div class="pbar"><i id="allBar"></i></div><div class="ptext"><span id="allCur">0:00</span><span id="allTime">${ep.dur}</span></div></div>
        <div class="mode-toggle">
          <button data-k="all" class="active">整段视频</button>
          <button data-k="audio">只听音频</button>
        </div>
      </div>
      <div class="listen-hint"><div class="lh-txt"><b>泛听</b>：先完整看一遍视频，抓大意。<b>点击任意句子</b> → 该句高亮并朗读视频原声。</div><button id="txtToggle" class="txt-toggle">🔤 显示文本</button></div>
      <div class="all-lines hide-txt" id="allLines">${lineHtml}</div>
    </div>`;
  bindAllPlayer(ep, lines);
  setTimeout(function(){ window.scrollTo(0,0); }, 30);
}

function bindAllPlayer(ep, lines){
  const video=trackMedia(document.getElementById('pv'));
  // 竖屏/横屏自动适配：让 video 元素贴合视频本身比例，避免拉伸变形
  video.addEventListener('loadedmetadata',()=>{
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw||!vh)return;
    if(vh>vw){
      video.style.width='auto'; video.style.height='min(58vh,560px)'; video.style.maxWidth='100%'; video.style.margin='0 auto'; video.style.display='block';
    }else{
      video.style.width='100%'; video.style.height='auto'; video.style.maxHeight='58vh'; video.style.margin='0 auto'; video.style.display='block';
    }
  });
  const playBtn=document.getElementById('allPlayBtn');
  const bar=document.getElementById('allBar'), curT=document.getElementById('allCur'), timeT=document.getElementById('allTime');
  const prog=document.getElementById('allProg');
  const audio=trackMedia(new Audio('media/ep'+ep.n+'.mp3'));
  let kind='all', sentIdx=0, tts=null;
  const txtToggle=document.getElementById('txtToggle');
  const allLinesEl=document.getElementById('allLines');
  if(txtToggle&&allLinesEl){ txtToggle.onclick=()=>{ const hide=allLinesEl.classList.toggle('hide-txt'); txtToggle.innerHTML=hide?'🔤 显示文本':'🔤 隐藏文本'; }; }

  function setPlayingState(el){
    document.querySelectorAll('.all-line').forEach((x,i)=>x.classList.toggle('playing', i===el));
    if(el>=0){ const line=document.querySelectorAll('.all-line')[el]; if(line)line.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  }
  let sentTick=null;
  function stopAllMedia(){
    if(tts){ speechSynthesis.cancel(); tts=null; }
    if(!audio.paused)audio.pause();
    if(!video.paused)video.pause();
  }
  // 模式切换
  document.querySelectorAll('.mode-toggle button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('.mode-toggle button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
      kind=b.dataset.k; stopAllMedia();
      playBtn.innerHTML=playIcon;
      const _card=document.querySelector('.listen-all-card'); if(_card)_card.classList.toggle('audio-mode', kind==='audio');
      if(kind==='audio'){ bindMiniPlayer(audio,'EP'+String(ep.n).padStart(2,'0')+' · 只听音频','audio'); }
      else if(kind==='all'){ if(curAudio&&curAudioKind==='video')hideMini(); }
      else if(kind==='sent'){ sentIdx=0; playSent(0); }
    };
  });
  // 大播放按钮
  playBtn.onclick=()=>{
    if(kind==='all'){
      if(video.paused){ stopAllMedia(); video.play(); playBtn.innerHTML=pauseIcon; bindMiniPlayer(video,'EP'+String(ep.n).padStart(2,'0')+' · '+ep.title,'video'); }
      else{ video.pause(); playBtn.innerHTML=playIcon; }
    }else if(kind==='audio'){
      if(audio.paused){ stopAllMedia(); audio.play(); playBtn.innerHTML=pauseIcon; }
      else{ audio.pause(); playBtn.innerHTML=playIcon; }
    }else{
      if(!video.paused){ video.pause(); playBtn.innerHTML=playIcon; }
      else { playSent(sentIdx); }
    }
  };
  // 视频事件
  video.addEventListener('play',()=>{ playBtn.innerHTML=pauseIcon; if(kind==='all'){ document.querySelectorAll('.mode-toggle button').forEach(x=>x.classList.toggle('active',x.dataset.k==='all')); bindMiniPlayer(video,'EP'+String(ep.n).padStart(2,'0')+' · '+ep.title,'video'); } });
  video.addEventListener('pause',()=>{ playBtn.innerHTML=playIcon; });
  video.addEventListener('timeupdate',()=>{ if(video.duration){ bar.style.width=(video.currentTime/video.duration*100)+'%'; curT.textContent=fmtT(video.currentTime); } });
  // 音频事件
  audio.addEventListener('play',()=>{ playBtn.innerHTML=pauseIcon; });
  audio.addEventListener('pause',()=>{ playBtn.innerHTML=playIcon; });
  audio.addEventListener('timeupdate',()=>{ if(audio.duration){ bar.style.width=(audio.currentTime/audio.duration*100)+'%'; curT.textContent=fmtT(audio.currentTime); } });
  // 进度条点击
  prog.addEventListener('click',e=>{
    const r=prog.getBoundingClientRect(); const p=(e.clientX-r.left)/r.width;
    if(kind==='all'&&video.duration){ video.currentTime=p*video.duration; }
    if(kind==='audio'&&audio.duration){ audio.currentTime=p*audio.duration; }
  });
  // 逐句播放（视频原声片段）
  function playSent(i){
    if(i<0||i>=lines.length)return;
    const t=(TS[ep.n]&&TS[ep.n][i]);
    stopAllMedia();
    sentIdx=i; setPlayingState(i);
    if(!t){ setPlayingState(-1); return; }
    const wt0=(WTS[ep.n]&&WTS[ep.n][i])||[];
    const endT=(wt0.length&&wt0[wt0.length-1]&&isFinite(wt0[wt0.length-1][1]))?wt0[wt0.length-1][1]+0.35:t[1];
    if(sentTick){ video.removeEventListener('timeupdate',sentTick); sentTick=null; }
    video.currentTime=t[0];
    video.play();
    playBtn.innerHTML=pauseIcon;
    bindMiniPlayer(video,'EP'+String(ep.n).padStart(2,'0')+' · 第'+(i+1)+'句','video');
    const tick=()=>{
      if(video.currentTime>=endT){
        video.removeEventListener('timeupdate',tick);
        sentTick=null;
        video.pause();
        playBtn.innerHTML=playIcon;
        if(autoAdvance&&i<lines.length-1){ setTimeout(()=>playSent(i+1),450); }
        else setPlayingState(-1);
      }
    };
    sentTick=tick;
    video.addEventListener('timeupdate',tick);
  }
  // 逐句行点击
  document.querySelectorAll('.all-line').forEach(line=>{
    line.addEventListener('click',()=>{
      const i=Number(line.dataset.i);
      kind='sent'; document.querySelectorAll('.mode-toggle button').forEach(x=>x.classList.toggle('active',x.dataset.k==='sent'));
      playSent(i);
    });
  });

  // 主播放按钮默认绑定视频（泛听）
  bindMiniPlayer(video,'EP'+String(ep.n).padStart(2,'0')+' · '+ep.title,'video');
  curAudio=video; curAudioKind='video';
  // 大进度条：点击/拖拽跳转
  const seekM=()=> (kind==='audio')?audio:video;
  let allSeek=false;
  function seekAllBy(e){ const m=seekM(); if(!m||!m.duration)return; const r=prog.getBoundingClientRect(); const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)); try{ m.currentTime=ratio*m.duration; }catch(_){} }
  prog.addEventListener('pointerdown',e=>{ allSeek=true; try{prog.setPointerCapture(e.pointerId);}catch(_){} seekAllBy(e); });
  prog.addEventListener('pointermove',e=>{ if(allSeek)seekAllBy(e); });
  prog.addEventListener('pointerup',()=>{ allSeek=false; });
  prog.addEventListener('pointercancel',()=>{ allSeek=false; });
}

/* 模拟 TTS 为可绑定的 mini 播放对象 */
function ttsLikeAudio(tts){
  return {
    paused:false, duration:NaN, currentTime:0,
    addEventListener:function(t,fn){ if(t==='play'){ /* noop */ } if(t==='pause'){ /* noop */ } },
    play:function(){ return true; }, pause:function(){ speechSynthesis.cancel(); }
  };
}

/* ============ 视图：精听 ============ */
function openListen(n){
  stopAllGlobal();
  const ep=EPS.find(e=>e.n===n); if(!ep)return;
  if(ep.st==='soon'){ toast('🛠️ 该期内容制作中，敬请期待～'); return; }
  if(ep.st==='lock' && !isUnlocked()){ openUnlock(n); return; }
  view='listen'; curEp=n; curIdx=0;
  renderTopbar(ep,'🎬','listen-all','切到泛听');
  renderListenView(ep);
  setTimeout(function(){ window.scrollTo(0,0); }, 30);
}
function renderListenView(ep){
  const L=LESSONS[ep.n]||{zh:'',it:'',sent:[],vocab:[]};
  const lines=(L.sent&&L.sent.length?L.sent:[{it:L.it,zh:L.zh}]);
  const lineHtml=lines.map((s,i)=>`<div class="ll-line ${i===curIdx?'active':''}" data-i="${i}"><span class="ll-no">${String(i+1).padStart(2,'0')}</span><span>${esc(s.it)}</span></div>`).join('');
  const vocab=L.vocab||[];
  const noteHtml='<div class="note-box" id="lcNote"></div>';
  document.getElementById('app').innerHTML=`
    ${epHeader(ep)}
    <div class="player-shell">
      <video id="jv" src="media/ep${ep.n}.mp4" preload="auto" playsinline style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"></video>
      <div class="listen-card">
        <div class="lc-head">
          <span class="lc-no" id="lcNo">EPISODIO ${String(ep.n).padStart(2,'0')} · FRASE ${String(curIdx+1).padStart(2,'0')} / ${lines.length}</span>
          <span class="lc-role">🎧 精听 · 听一句 · 跟一句</span>
        </div>
        <div class="it-full" id="itFull"></div>
        <div class="zh-full" id="zhFull"></div>
        <div class="audio-row">
          <button class="play-btn" id="jtPlay">▶</button>
          <div class="wave"><span>点击播放本句（视频原声）· 逐词点击可发音</span><b id="jtLabel">FRASE ${curIdx+1}</b></div>
        </div>
        <div class="nav-row">
          <button class="nbtn" id="jtPrev" ${curIdx===0?'disabled':''}>← 上一句</button>
          <button class="nbtn" id="jtNext" ${curIdx===lines.length-1?'disabled':''}>下一句 →</button>
          <button class="nbtn" id="jtAuto" style="margin-left:auto;">🔁 自动连读</button>
        </div>
        ${noteHtml}
      </div>
      <div class="listen-list">
        <h4>逐句列表 · 点击跳转</h4>
        ${lineHtml}
      </div>
    </div>`;
  showCur(ep, lines);
  bindJint(ep, lines);
}
function showCur(ep, lines){
  const cur=lines[curIdx];
  const vocab=(LESSONS[ep.n]||{}).vocab||[];
  const noEl=document.getElementById('lcNo');
  if(noEl)noEl.textContent='EPISODIO '+String(ep.n).padStart(2,'0')+' · FRASE '+String(curIdx+1).padStart(2,'0')+' / '+lines.length;
  document.getElementById('itFull').innerHTML=renderIt(cur.it, vocab);
  document.getElementById('zhFull').textContent=cur.zh;
  const noteEl=document.getElementById('lcNote');
  if(noteEl){
    const curVocab=vocab.filter(v=>new RegExp(esc_re(v.e),'i').test(cur.it));
    noteEl.innerHTML = curVocab.length
      ? `<div class="note-title">📌 重点表达 & 地道短语</div><ul>${curVocab.map(v=>`<li><b>${esc(v.e)}</b> — ${esc(v.m)}：${esc(v.d)}${v.ex?`<div class="v-ex">💬 ${esc(v.ex)}</div><div class="v-ex-zh">${esc(v.exZh||'')}</div>`:''}</li>`).join('')}</ul>`
      : '<div class="note-title">📌 精听提示</div><p>点击播放，逐句听清每个单词的发音和连读，再跟读。</p>';
  }
  document.getElementById('jtLabel').textContent='FRASE '+(curIdx+1);
  const jtPrev=document.getElementById('jtPrev'), jtNext=document.getElementById('jtNext');
  if(jtPrev)jtPrev.disabled=curIdx===0;
  if(jtNext)jtNext.disabled=curIdx===lines.length-1;
  document.querySelectorAll('.ll-line').forEach(ln=>ln.classList.toggle('active',Number(ln.dataset.i)===curIdx));
  document.querySelectorAll('#itFull .w').forEach((w,wi)=>{
    w.onclick=()=>{
      document.querySelectorAll('#itFull .w').forEach(x=>x.classList.remove('lit'));
      w.classList.add('lit');
      setTimeout(()=>w.classList.remove('lit'),1100);
      const wt=(WTS[ep.n]&&WTS[ep.n][curIdx])||[];
      const t=wt[wi];
      if(!t)return;
      const v=document.getElementById('jv');
      if(!v)return;
      v.pause();
      try{ v.currentTime=Math.max(0,t[0]-0.06); }catch(e){}
      if(v._wfn){ v.removeEventListener('timeupdate',v._wfn); v._wfn=null; }
      let end=t[1]+0.4;
      const nxt=wt[wi+1];
      if(nxt){ end=Math.min(t[1]+0.4, nxt[0]-0.03); if(end<t[1]+0.18) end=t[1]+0.18; }
      v._wfn=()=>{ if(v.currentTime>=end){ v.pause(); if(v._wfn){ v.removeEventListener('timeupdate',v._wfn); v._wfn=null; } } };
      v.addEventListener('timeupdate',v._wfn);
      v.play();
    };
  });
}

function bindJint(ep, lines){
  let auto=false, playing=false;
  const playBtn=document.getElementById('jtPlay');
  function curVideo(){ return document.getElementById('jv'); }
  function stopVoice(){
    const v=curVideo();
    if(v&&!v.paused){ v.pause(); }
    playing=false;
  }
  function setPlayingLine(i){
    document.querySelectorAll('.ll-line').forEach((ln,x)=>ln.classList.toggle('playing',x===i));
  }
  let jTick=null;
  function playRange(i){
    const t=(TS[ep.n]&&TS[ep.n][i]);
    const v=curVideo();
    if(!v||!t)return;
    stopVoice();
    const wt0=(WTS[ep.n]&&WTS[ep.n][i])||[];
    const endT=(wt0.length&&wt0[wt0.length-1]&&isFinite(wt0[wt0.length-1][1]))?wt0[wt0.length-1][1]+0.35:t[1];
    curIdx=i; showCur(ep, lines);
    try{ v.currentTime=t[0]; }catch(e){}
    const pp=v.play(); if(pp&&pp.catch){ pp.catch(function(){ try{ v.currentTime=t[0]; v.play(); }catch(e){} }); }
    playing=true;
    playBtn.innerHTML=pauseIcon;
    bindMiniPlayer(v,'EP'+String(ep.n).padStart(2,'0')+' · 第'+(i+1)+'句','video');
    setPlayingLine(i);
    if(jTick){ v.removeEventListener('timeupdate',jTick); jTick=null; }
    const tick=()=>{
      if(v.currentTime>=endT){
        v.removeEventListener('timeupdate',tick);
        jTick=null;
        v.pause();
        playing=false;
        playBtn.innerHTML=playIcon;
        setPlayingLine(-1);
        if(auto&&i<lines.length-1){ setTimeout(()=>{ if(auto)playRange(i+1); },450); }
      }
    };
    jTick=tick;
    v.addEventListener('timeupdate',tick);
  }
  playBtn.onclick=()=>{
    const v=curVideo();
    if(playing&&v&&!v.paused){ stopVoice(); playBtn.innerHTML=playIcon; setPlayingLine(-1); }
    else playRange(curIdx);
  };
  document.getElementById('jtPrev').onclick=()=>{ if(curIdx>0){ stopVoice(); playRange(curIdx-1); } };
  document.getElementById('jtNext').onclick=()=>{ if(curIdx<lines.length-1){ stopVoice(); playRange(curIdx+1); } };
  document.getElementById('jtAuto').onclick=e=>{
    auto=!auto;
    e.target.style.background=auto?'var(--terracotta)':'var(--white)';
    e.target.style.color=auto?'#fff':'var(--olive-deep)';
    e.target.textContent=auto?'⏹ 停止连读':'🔁 自动连读';
    if(auto)playRange(curIdx);
  };
  document.querySelectorAll('.ll-line').forEach(ln=>{
    ln.addEventListener('click',()=>{ playRange(Number(ln.dataset.i)); });
  });
}

function sayWord(t){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='it-IT'; u.rate=0.85; const v=pickVoice(); if(v)u.voice=v; speechSynthesis.speak(u); }

/* ============ 工具 ============ */
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/it[-_]IT/i.test(v.lang))||vs.find(v=>/^it/i.test(v.lang))||null;
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }
function esc_re(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,function(m){return '\\'+m;}); }
function wrapWords(t){ return t.replace(/([A-Za-z0-9àèéìòùÀÈÉÌÒÙ'’]+)/g,m=>'<span class="w">'+m+'</span>'); }
function renderIt(txt,vocab){
  const kws=(vocab||[]).map(v=>v.e).sort((a,b)=>b.length-a.length);
  let t=esc(txt);
  const kwRe=kws.length?new RegExp('('+kws.map(k=>esc_re(k)).join('|')+')','gi'):null;
  let html='';
  if(kwRe){
    let last=0,m;
    while((m=kwRe.exec(t))!==null){
      html+=wrapWords(t.slice(last,m.index));
      const hit=m[0];
      const vi=(vocab||[]).findIndex(v=>v.e.toLowerCase()===hit.toLowerCase());
      const vv=vi>=0?vocab[vi]:null;
      html+='<span class="kw" data-m="'+esc(vv?vv.m:'')+'">'+wrapWords(hit)+'</span>';
      last=m.index+m[0].length;
      if(m.index===kwRe.lastIndex)kwRe.lastIndex++;
    }
    html+=wrapWords(t.slice(last));
  }else{ html=wrapWords(t); }
  return html;
}

/* 悬浮返回 */
document.getElementById('floatBack').addEventListener('click',()=>viewHome());

/* 初始化 */
viewHome();
