<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🇮🇹 跟着油管博主学意大利语 · 看视频学口语</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --paper:#F7F1E6; --paper-deep:#EFE5D2;
    --terracotta:#B4582E; --terracotta-deep:#8F3F1F;
    --olive:#6E7443; --olive-deep:#4E5430;
    --ink:#3A2E26; --ink-soft:#6B5B4F;
    --cream:#FBF7EE; --gold:#E0A94E; --gold-soft:#F0C878;
    --line:#E3D7C0; --white:#FFFDF8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Noto Serif SC',Georgia,'Songti SC',SimSun,serif;}

  /* ===== 顶部导航 ===== */
  .topbar{
    position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:10px 16px;background:var(--ink);color:var(--paper);font-size:12px;
  }
  .tb-left,.tb-right{flex:0 0 auto;min-width:80px;display:flex;justify-content:flex-start;}
  .tb-right{justify-content:flex-end;}
  .tb-title{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em;}
  .tb-title b{color:var(--gold-soft);font-weight:500;}
  .tb-back{
    display:inline-flex;align-items:center;gap:4px;color:var(--gold-soft);
    text-decoration:none;font-size:13px;letter-spacing:.02em;font-weight:500;
    padding:4px 10px;border:1px solid rgba(240,200,120,.4);border-radius:999px;cursor:pointer;
    transition:all .15s;background:none;
  }
  .tb-back:hover{background:rgba(240,200,120,.15);color:#F8D98F;}

  /* ===== Hero ===== */
  .hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#F4E6CE 0%,var(--paper) 100%);border-bottom:1px solid var(--line);}
  .hero-inner{max-width:1100px;margin:0 auto;padding:40px 24px 32px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:36px;align-items:center;}
  .hero-copy .kicker{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;color:var(--terracotta-deep);
    background:rgba(180,88,46,.09);border:1px solid rgba(180,88,46,.25);padding:5px 12px;border-radius:999px;font-weight:500;
  }
  .hero-copy .house-no{font-family:Georgia,serif;font-size:15px;color:var(--gold);letter-spacing:.1em;margin-top:14px;font-weight:700;}
  .hero-copy h1{font-family:'Noto Serif SC',Georgia,serif;font-size:clamp(30px,4.6vw,48px);font-weight:900;line-height:1.15;margin:6px 0 4px;letter-spacing:.01em;}
  .hero-copy .it-sub{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(20px,2.8vw,28px);color:var(--olive-deep);margin-bottom:14px;line-height:1.5;}
  .hero-copy .intro{font-size:15px;color:var(--ink-soft);max-width:520px;margin-bottom:20px;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
    padding:10px 20px;border-radius:999px;text-decoration:none;cursor:pointer;border:none;
    transition:transform .15s, box-shadow .15s, background .15s;
  }
  .btn-primary{background:var(--terracotta);color:#fff;}
  .btn-primary:hover{background:var(--terracotta-deep);transform:translateY(-1px);box-shadow:0 6px 14px rgba(180,88,46,.3);}
  .btn-ghost{background:var(--white);color:var(--olive-deep);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-deep);transform:translateY(-1px);}
  .hero-visual{position:relative;}
  .hero-visual .frame{border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 34px rgba(58,46,38,.14);position:relative;background:linear-gradient(135deg,#2c8a70,#1e6f5c 55%,#e8853a);height:220px;display:flex;align-items:center;justify-content:center;}
  .hero-visual .frame .big-emoji{font-size:110px;opacity:.9;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));}
  .hero-visual .badge{position:absolute;top:14px;left:14px;background:rgba(58,46,38,.78);color:var(--gold-soft);font-size:12px;letter-spacing:.12em;padding:6px 12px;border-radius:8px;}
  .hero-visual .cito-float{position:absolute;right:-14px;bottom:-18px;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;font-size:12px;box-shadow:0 10px 24px rgba(58,46,38,.28);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:9px;letter-spacing:.06em;}
  .cito-float .led{width:9px;height:9px;border-radius:50%;background:#5BB85C;box-shadow:0 0 8px #5BB85C;}

  /* ===== 区块 ===== */
  .section{max-width:1100px;margin:0 auto;padding:30px 24px;}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px;}
  .sec-head h2{font-family:'Noto Serif SC',Georgia,serif;font-size:24px;font-weight:700;}
  .sec-head .en{font-family:Georgia,serif;font-style:italic;color:var(--ink-soft);font-size:14px;}
  .sec-head .meta{font-size:13px;color:var(--olive-deep);}

  /* ===== 统计 & 筛选 ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 6px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;color:var(--terracotta);font-family:Georgia,serif;}
  .stat span{font-size:11px;color:var(--ink-soft);}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px;}
  .search{flex:1 1 200px;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:13px;outline:none;background:var(--white);font-family:inherit;color:var(--ink);}
  .search:focus{border-color:var(--terracotta);}
  .chip{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;background:var(--white);border:1.5px solid var(--line);color:var(--ink-soft);cursor:pointer;user-select:none;transition:all .15s;}
  .chip:hover{border-color:var(--olive);color:var(--olive-deep);}
  .chip.on{background:var(--terracotta);border-color:var(--terracotta);color:#fff;}

  /* ===== 剧集卡片（目录） ===== */
  .episode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
  .ep-card{
    display:flex;flex-direction:row;flex-wrap:wrap;align-items:stretch;background:var(--white);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .ep-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(58,46,38,.12);border-color:#d9c9a8;}
  .ep-card .ep-cover{position:relative;flex:0 0 46%;height:170px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .ep-card .ep-cover .cv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(160deg,var(--cc1,#E8F3EF),var(--cc2,#CFE4DC));}
  .ep-card .ep-cover img.cv{object-fit:cover;width:100%;height:100%;}
  .ep-card .ep-cover .ep-no{position:absolute;top:8px;left:8px;background:rgba(58,46,38,.78);color:var(--gold-soft);font-size:11px;letter-spacing:.1em;padding:4px 9px;border-radius:7px;z-index:2;}
  .ep-card .ep-cover .ep-time{position:absolute;bottom:10px;right:10px;background:rgba(247,241,230,.92);color:var(--terracotta-deep);font-family:Georgia,serif;font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px;z-index:2;}
  .ep-card .ep-body{padding:14px 15px 13px;display:flex;flex-direction:column;flex:1;min-width:0;}
  .ep-card h3{font-family:'Noto Serif SC',Georgia,serif;font-size:16.5px;font-weight:700;line-height:1.35;}
  .ep-card .ep-it{font-family:Georgia,serif;font-style:italic;font-size:12.5px;color:var(--olive-deep);margin:3px 0 7px;}
  .ep-card .ep-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ep-card .ep-meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink-soft);}
  .ep-card .ep-meta .stars{color:var(--gold);letter-spacing:1px;}
  .ep-card .ep-actions{flex:0 0 100%;display:flex;gap:8px;padding:12px 15px 14px;margin-top:0;border-top:1px solid var(--line);}
  .ep-card .mini-btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;white-space:nowrap;
    padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:all .15s;
  }
  .mini-btn.primary{background:var(--terracotta);color:#fff;}
  .mini-btn.primary:hover{background:var(--terracotta-deep);}
  .mini-btn.secondary{background:var(--white);color:var(--olive-deep);border-color:var(--line);}
  .mini-btn.secondary:hover{background:var(--paper-deep);}
  .mini-btn.pending{background:#EDE7DA;color:var(--ink-soft);border-color:var(--line);cursor:not-allowed;}
  .mini-btn.locked{background:var(--terracotta);color:#fff;opacity:.92;}
  .mini-btn.locked:hover{background:var(--terracotta);}
  .ep-card.locked .ep-cover .cv{filter:grayscale(.5) brightness(.8);}
  .ep-card.locked .ep-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(20,14,8,.2),rgba(20,14,8,.5));}
  .lock-badge{position:absolute;top:8px;right:8px;z-index:3;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,250,240,.92);box-shadow:0 2px 8px rgba(0,0,0,.22);}
  .tag-pending{font-size:11px;color:var(--ink-soft);background:var(--paper-deep);padding:2px 8px;border-radius:999px;align-self:flex-start;margin-top:2px;}

  /* ===== 单集学习页通用 ===== */
  .ep-hero{max-width:1100px;margin:0 auto;padding:22px 24px 8px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ep-hero .backpill{
    display:inline-flex;align-items:center;gap:6px;color:var(--olive-deep);text-decoration:none;font-size:13px;font-weight:500;
    background:var(--white);border:1px solid var(--line);padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .15s;
  }
  .ep-hero .backpill:hover{background:var(--paper-deep);}
  .ep-hero .kicker{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em;color:var(--terracotta-deep);background:rgba(180,88,46,.09);border:1px solid rgba(180,88,46,.25);padding:4px 11px;border-radius:999px;font-weight:600;}
  .ep-hero h1{font-family:'Noto Serif SC',Georgia,serif;font-size:clamp(20px,3vw,30px);font-weight:900;margin:6px 0 2px;}
  .ep-hero .sub{font-size:13px;color:var(--ink-soft);}
  .mode-switch{margin-left:auto;}
  .mode-switch a{
    display:inline-flex;align-items:center;gap:6px;background:var(--terracotta);border-color:var(--terracotta);color:#fff;
    text-decoration:none;font-size:13px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;transition:all .15s;
  }
  .mode-switch a:hover{background:var(--terracotta-deep);}

  /* ===== 泛听视图 ===== */
  .listen-all-card{max-width:1100px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px 24px;box-shadow:0 10px 28px rgba(58,46,38,.07);}
  .video-box{position:relative;background:#111;border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .listen-all-card.audio-mode .video-box{display:none;}
  .video-box video{width:100%;display:block;max-height:58vh;background:#000;object-fit:contain;margin:0 auto;}
  .all-player{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper-deep);border-radius:14px;padding:12px 16px;margin-bottom:18px;}
  .all-player .big-play{
    width:48px;height:48px;border-radius:50%;background:var(--terracotta);color:#fff;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s, transform .15s;font-size:19px;
  }
  .all-player .big-play:hover{background:var(--terracotta-deep);transform:scale(1.05);}
  .all-player .progress{flex:1;min-width:180px;cursor:pointer;}
  .all-player .progress .pbar{height:6px;background:#DDD2BC;border-radius:99px;overflow:hidden;position:relative;}
  .all-player .progress .pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--terracotta);border-radius:99px;width:0%;}
  .all-player .progress .ptext{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .all-player .mode-toggle{display:flex;gap:4px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .all-player .mode-toggle button{border:none;background:transparent;padding:6px 13px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-weight:600;transition:all .15s;}
  .all-player .mode-toggle button.active{background:var(--terracotta);color:#fff;}
  .listen-hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .listen-hint .lh-txt{flex:1;}
  .txt-toggle{flex-shrink:0;background:var(--paper-deep);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:12px;color:var(--olive-deep);cursor:pointer;white-space:nowrap;transition:all .15s;}
  .txt-toggle:hover{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
  .all-lines.hide-txt .ln-it,.all-lines.hide-txt .ln-zh{display:none;}
  .all-lines.hide-txt .ln-body{min-height:34px;display:flex;align-items:center;}
  .listen-hint b{color:var(--terracotta);}
  .all-lines{display:grid;gap:9px;max-height:460px;overflow:auto;padding-right:6px;padding-bottom:96px;}
  .all-line{
    display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:start;
    background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;transition:all .15s;
  }
  .all-line:hover{border-color:#d9c9a8;background:#FFFDF6;}
  .all-line.playing{border-color:var(--terracotta);background:#FFF3EA;}
  .all-line .ln-no{font-family:Georgia,serif;font-size:12.5px;color:var(--terracotta);font-weight:700;padding-top:2px;}
  .all-line .ln-body .ln-it{font-family:Georgia,serif;font-size:15px;color:var(--ink);}
  .all-line .ln-body .ln-zh{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .all-line .ln-play{
    width:31px;height:31px;border-radius:50%;background:var(--paper-deep);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:12px;color:var(--olive-deep);flex-shrink:0;
  }
  .all-line .ln-play:hover{background:var(--terracotta);color:#fff;}
  .all-line.playing .ln-play{background:var(--terracotta);color:#fff;}

  /* ===== 精听视图 ===== */
  .player-shell{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;padding:6px 24px 20px;}
  .listen-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:26px 28px;box-shadow:0 10px 28px rgba(58,46,38,.07);}
  .listen-card .lc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .lc-head .lc-no{font-family:Georgia,serif;font-size:12.5px;color:var(--terracotta);letter-spacing:.16em;font-weight:700;}
  .lc-head .lc-role{display:inline-flex;align-items:center;gap:7px;background:rgba(110,116,67,.12);color:var(--olive-deep);border:1px solid rgba(110,116,67,.28);font-size:12px;padding:4px 11px;border-radius:999px;font-weight:600;}
  .listen-card .it-full{font-family:Georgia,'Times New Roman',serif;font-size:clamp(18px,2.4vw,24px);line-height:1.5;margin-bottom:10px;color:var(--ink);}
  .listen-card .it-full .w{cursor:pointer;border-radius:4px;padding:0 1px;}
  .listen-card .it-full .w:hover{background:#f5ead2;}
  .listen-card .it-full .w.speaking{background:var(--terracotta);color:#fff;}
  .listen-card .zh-full{font-size:15px;color:var(--ink-soft);border-left:3px solid var(--gold);padding-left:14px;margin-bottom:18px;line-height:1.8;}
  .audio-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .audio-row .play-btn{
    width:46px;height:46px;border-radius:50%;background:var(--terracotta);color:#fff;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s, transform .15s;flex-shrink:0;
  }
  .audio-row .play-btn:hover{background:var(--terracotta-deep);transform:scale(1.05);}
  .audio-row .wave{color:var(--olive-deep);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .audio-row .wave b{color:var(--terracotta);}
  .nav-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .nav-row .nbtn{
    background:var(--white);border:1.5px solid var(--line);color:var(--olive-deep);border-radius:999px;padding:7px 16px;
    font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;
  }
  .nav-row .nbtn:hover{border-color:var(--terracotta);color:var(--terracotta-deep);}
  .nav-row .nbtn:disabled{opacity:.4;cursor:not-allowed;}
  .note-box{background:#FFF9EE;border:1px solid #EFDFC2;border-radius:14px;padding:15px 18px;margin-top:18px;}
  .note-box .note-title{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--terracotta-deep);letter-spacing:.06em;margin-bottom:8px;}
  .note-box p,.note-box li{font-size:13.5px;color:var(--ink);line-height:1.75;}
  .note-box ul{margin:4px 0 4px 18px;}
  .note-box b{color:var(--olive-deep);}
  .note-box .v-ex{color:var(--olive-deep);font-size:13px;margin-top:3px;}
  .note-box .v-ex-zh{color:var(--ink-soft);font-size:12.5px;margin-bottom:2px;}
  /* 精听划线词：悬停显示意思 */
  .it-full .kw{position:relative;border-bottom:2px dashed var(--gold);font-weight:700;cursor:pointer;}
  .it-full .kw::after{content:attr(data-m);position:absolute;bottom:135%;left:0;background:#3A2E26;color:#fff;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translateY(4px);transition:all .15s;z-index:60;max-width:240px;overflow:hidden;text-overflow:ellipsis;}
  .it-full .kw:hover::after{opacity:1;transform:translateY(0);}
  .it-full .kw:hover{background:rgba(222,171,66,.18);}
  .it-full .w{cursor:pointer;border-radius:4px;transition:background .15s;}
  .it-full .w:hover{background:rgba(222,171,66,.16);}
  .it-full .w.lit{background:var(--gold);color:#fff;border-radius:4px;}

  /* 精听逐句导航列表 */
  .listen-list{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px 16px 96px;box-shadow:0 10px 28px rgba(58,46,38,.07);position:sticky;top:64px;}
  .listen-list h4{font-size:13px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:10px;border-bottom:1px dashed var(--line);padding-bottom:8px;}
  .listen-list .ll-line{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;transition:background .12s;
    font-size:12.5px;color:var(--ink);border:1px solid transparent;margin-bottom:4px;
  }
  .listen-list .ll-line:hover{background:var(--paper-deep);}
  .listen-list .ll-line.active{background:#FFF3EA;border-color:var(--terracotta);color:var(--terracotta-deep);font-weight:600;}
  .listen-list .ll-line .ll-no{font-family:Georgia,serif;font-size:11px;color:var(--ink-soft);flex-shrink:0;width:18px;}
  .listen-list .ll-line.active .ll-no{color:var(--terracotta);}

  /* ===== 迷你播放器 ===== */
  .mini-player{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:10px;
    background:rgba(255,249,238,.97);border:1.5px solid #E3CFA8;border-radius:16px;box-shadow:0 8px 30px rgba(58,46,38,.20);
    padding:9px 14px;max-width:660px;width:min(660px,94vw);backdrop-filter:blur(6px);
  }
  .mini-player.hidden{display:none;}

  it:"Seguire le novità può essere stimolante e divertente, ma l'eleganza autentica va ben oltre il semplice abbracciare il trend del momento. L'eleganza classica è una forma d'espressione senza tempo, capace di attraversare epoche e stili, rimanendo sempre attuale. È quella qualità discreta e sofisticata che non ha bisogno di ostentazione, ma si manifesta nella cura dei dettagli, nella consapevolezza di sé e nella capacità di scegliere ciò che davvero valorizza la propria personalità.",
  sent:[
    {it:"Seguire le novità può essere stimolante e divertente, ma l'eleganza autentica va ben oltre il semplice abbracciare il trend del momento.",zh:"追随新潮可能既刺激又有趣，但真正的优雅远不止于简单地拥抱当下的流行趋势。"},
    {it:"L'eleganza classica è una forma d'espressione senza tempo, capace di attraversare epoche e stili, rimanendo sempre attuale.",zh:"经典优雅是一种超越时间的表达形式，能够跨越时代和风格，始终保持其现代性。"},
    {it:"È quella qualità discreta e sofisticata che non ha bisogno di ostentazione, ma si manifesta nella cura dei dettagli, nella consapevolezza di sé e nella capacità di scegliere ciò che davvero valorizza la propria personalità.",zh:"它是那种低调而精致的品质，不需要炫耀，而是通过对细节的关注、对自我的清晰认知，以及善于选择那些能真正凸显个人魅力的元素。"},
  ],
  vocab:[
    {e:"Seguire le novità",m:"追随新潮",d:"\"Seguire\"=跟随；\"le novità\"=新事物、新潮流。",ex:"Molti giovani amano seguire le novità del mondo della moda.",exZh:"许多年轻人喜欢追随时尚界的新潮流。"},
    {e:"stimolante e divertente",m:"刺激又有趣",d:"\"stimolante\"=刺激的；\"divertente\"=有趣的。",ex:"Il viaggio in Giappone è stato stimolante e divertente per tutta la famiglia.",exZh:"去日本旅行对全家人来说既刺激又有趣。"},
    {e:"autentica",m:"真正的，纯正的",d:"形容词，真实、纯正、不造作。",ex:"Questo ristorante offre un'esperienza autentica della tradizione italiana.",exZh:"这家餐厅提供意大利传统的纯正体验。"},
    {e:"ben oltre",m:"远远超过",d:"\"ben\"=很；\"oltre\"=超过。",ex:"Il suo contributo alla ricerca va ben oltre quello che ci aspettavamo.",exZh:"他对研究的贡献远远超出了我们的期望。"},
    {e:"abbracciare il trend del momento",m:"拥抱当下流行趋势",d:"\"abbracciare\"=拥抱；\"trend del momento\"=当下的趋势。",ex:"Quell'azienda ha saputo abbracciare il trend del momento nel marketing digitale.",exZh:"那家公司善于拥抱数字营销领域的当前趋势。"},
    {e:"forma d'espressione senza tempo",m:"超越时间的表达形式",d:"\"forma d'espressione\"=表达形式；\"senza tempo\"=不受时间限制的。",ex:"La musica classica è una forma d'espressione senza tempo che continua ad emozionare.",exZh:"古典音乐是一种超越时间的表达形式，持续打动人心。"},
    {e:"attraversare epoche e stili",m:"跨越时代和风格",d:"\"attraversare\"=穿越；\"epoche\"=时代；\"stili\"=风格。",ex:"Il design italiano ha saputo attraversare epoche e stili rimanendo sempre riconoscibile.",exZh:"意大利设计能够跨越时代和风格，始终保持其辨识度。"},
    {e:"rimanendo sempre attuale",m:"始终保持现代性",d:"\"rimanendo\"=保持；\"attuale\"=现代的、时新的。",ex:"Le opere di Shakespeare continuano ad essere rappresentate, rimanendo sempre attuali.",exZh:"莎士比亚的作品继续上演，始终保持其现代意义。"},
    {e:"qualità discreta e sofisticata",m:"低调而精致的品质",d:"\"discreta\"=低调的；\"sofisticata\"=精致的、有品味的。",ex:"La sua eleganza ha una qualità discreta e sofisticata che non passa inosservata.",exZh:"她的优雅有一种低调而精致的品质，不会被忽视。"},
    {e:"non ha bisogno di ostentazione",m:"不需要炫耀",d:"\"non ha bisogno di\"=不需要；\"ostentazione\"=炫耀。",ex:"La vera ricchezza non ha bisogno di ostentazione per essere apprezzata.",exZh:"真正的财富不需要炫耀就能得到欣赏。"},
    {e:"si manifesta",m:"体现，表现",d:"反身动词，表示\"自我呈现\"。",ex:"La cultura di un popolo si manifesta anche attraverso le sue tradizioni culinarie.",exZh:"一个民族的文化也通过其烹饪传统表现出来。"},
    {e:"cura dei dettagli",m:"对细节的关注",d:"\"cura\"=注意；\"dettagli\"=细节。",ex:"La cura dei dettagli è ciò che distingue un prodotto artigianale di qualità.",exZh:"对细节的关注是区分优质手工产品的关键。"},
    {e:"consapevolezza di sé",m:"对自我的认知",d:"\"consapevolezza\"=意识、觉察；\"di sé\"=关于自己。",ex:"La consapevolezza di sé è il primo passo verso la crescita personale.",exZh:"自我认知是个人成长的第一步。"},
    {e:"capacità di scegliere",m:"选择的能力",d:"\"capacità\"=能力；\"scegliere\"=选择。",ex:"La maturità si dimostra nella capacità di scegliere ciò che è giusto, non ciò che è facile.",exZh:"成熟体现在选择正确的而非容易的事物的能力上。"},
    {e:"valorizza la propria personalità",m:"凸显个人特质",d:"\"valorizza\"=彰显；\"propria personalità\"=自己的个性。",ex:"Un buon abito valorizza la propria personalità senza mascherarla.",exZh:"一件好的衣服能凸显个人特质而不是掩盖它。"},
  ]
 },
2: {
  zh:"你好，我每天七点起床，为家里所有人准备早餐，然后送我妹妹去学校，她正在上初中，之后我一整天都在学习，还要再次为所有人做饭，因为我是家里唯一会做饭的人，然后我去接我妹妹，带她去参加她的活动，她和朋友们玩耍，然后我再把她带回家，和我的家人待在一起。",
  it:"Ciao, io mi sveglio alle sette, preparo la colazione per tutti in casa, poi porto mia sorella a scuola, fa le scuole medie, e dopodiché passo la mia giornata a studiare e cucino di nuovo per tutti, perché sono l'unica che cucina e vado a prendere mia sorella e la porto a fare le sue attività, gioca con gli amici e poi la riporto a casa e resto con la mia famiglia.",
  sent:[
    {it:"Ciao, io mi sveglio alle sette, preparo la colazione per tutti in casa, poi porto mia sorella a scuola, fa le scuole medie.",zh:"你好，我每天七点起床，为家里所有人准备早餐，然后送我妹妹去学校，她正在上初中。"},
    {it:"E dopodiché passo la mia giornata a studiare e cucino di nuovo per tutti, perché sono l'unica che cucina.",zh:"之后我一整天都在学习，还要再次为所有人做饭，因为我是家里唯一会做饭的人。"},
    {it:"E vado a prendere mia sorella e la porto a fare le sue attività, gioca con gli amici e poi la riporto a casa e resto con la mia famiglia.",zh:"然后我去接我妹妹，带她去参加她的活动，她和朋友们玩耍，然后我再把她带回家，和我的家人待在一起。"},
  ],
  vocab:[
    {e:"io mi sveglio alle sette",m:"我每天七点起床",d:"\"svegliarsi\"反身动词=醒来、起床；\"alle sette\"=在七点。",ex:"Io mi sveglio alle sei durante la settimana.",exZh:"工作日我六点起床。"},
    {e:"la colazione",m:"早餐",d:"意大利人早餐通常简单：咖啡+甜点心。",ex:"La colazione italiana di solito include un caffè e un cornetto.",exZh:"意大利早餐通常包括一杯咖啡和一个牛角包。"},
    {e:"porto",m:"送",d:"动词\"portare\"=带、送、携带。",ex:"Porto mio figlio all'asilo tutti i giorni.",exZh:"我每天送我儿子去幼儿园。"},
    {e:"a scuola",m:"去学校",d:"固定短语，表示去上学。",ex:"I bambini vanno a scuola dal lunedì al venerdì.",exZh:"孩子们周一到周五去上学。"},
    {e:"le scuole medie",m:"初中",d:"意大利教育系统中 11-14 岁阶段。",ex:"Dopo le scuole elementari, gli studenti frequentano le scuole medie per tre anni.",exZh:"小学之后，学生们上三年初中。"},
    {e:"dopodiché",m:"之后",d:"连接副词=在那之后、随后。",ex:"Abbiamo finito la riunione, dopodiché siamo andati a pranzo.",exZh:"我们结束了会议，之后去吃午饭。"},
    {e:"studiare",m:"学习",d:"动词=学习、研究。",ex:"Dedico molte ore a studiare le lingue straniere.",exZh:"我花很多时间学习外语。"},
    {e:"cucino",m:"做饭",d:"动词\"cucinare\"=烹饪、做饭。",ex:"Cucino volentieri per i miei amici il fine settimana.",exZh:"周末我很乐意为朋友们做饭。"},
    {e:"l'unica che cucina",m:"唯一会做饭的人",d:"\"unica/o\"=唯一的；\"che\"引导关系从句。",ex:"Mia madre è l'unica che sa preparare questo piatto tradizionale.",exZh:"我妈妈是唯一会做这道传统菜的人。"},
    {e:"vado a prendere",m:"去接",d:"常用搭配=去接某人。",ex:"Vado a prendere mia figlia all'asilo alle cinque.",exZh:"我五点去幼儿园接我女儿。"},
    {e:"la porto a fare le sue attività",m:"带她去参加她的活动",d:"\"portare a fare\"=带某人去做某事。",ex:"La porto a fare sport due volte alla settimana.",exZh:"我每周带她去两次运动。"},
    {e:"resto con",m:"待在...一起",d:"动词\"restare\"=留下、停留。",ex:"Resto con i nonni durante le vacanze estive.",exZh:"暑假期间我和祖父母待在一起。"},
  ]
 },
3: {
  zh:"我把面团分成了六个小球，然后擀开，尽量保持圆形。接着，我用平底锅以中火煎烤，每面大约1分钟。至于配料，我用一点橄榄油炒了一根甜椒和一颗金黄洋葱，两者都切成条状。我加了点盐，用大火翻炒了大约5分钟，直到它们变软。然后，我准备了一些鹰嘴豆泥，具体的食谱我会在下面分享给大家。接着，我把所有食材摆上桌，还额外加了200克熟红豆，它们和鹰嘴豆泥一起，成为这道菜的蛋白质来源。在晚餐期间，每个人都可以按照自己的喜好来搭配馅料，制作属于自己的美味皮塔饼。",
  it:"Ho diviso il mio impasto in 6 palline e le ho stese cercando di mantenere una forma rotonda. A questo punto le ho cotte in padella più o meno 1 min per lato a fuoco medio. Per condirle ho fatto saltare un peperone con una cipolla dorata e entrambi tagliati a strisce con un filo d'olio. Li ho salati e li ho cotti a fiamma alta per 5 min fino a quando non si sono ammorbiditi. Ho poi preparato dell'hummus con la ricetta che vi lascio qui sotto. E poi ho messo tutto in tavola aggiungendo anche 200g di fagioli rossi già cotti che saranno la fonte proteica di questo piatto insieme all'hummus. Durante la cena quindi ognuno di noi ha composto le proprie piadine nella maniera che preferiva.",
  sent:[
    {it:"Ho diviso il mio impasto in 6 palline e le ho stese cercando di mantenere una forma rotonda.",zh:"我把面团分成了六个小球，然后擀开，尽量保持圆形。"},
    {it:"A questo punto le ho cotte in padella più o meno 1 min per lato a fuoco medio.",zh:"接着，我用平底锅以中火煎烤，每面大约 1 分钟。"},
    {it:"Per condirle ho fatto saltare un peperone con una cipolla dorata e entrambi tagliati a strisce con un filo d'olio.",zh:"至于配料，我用一点橄榄油炒了一根甜椒和一颗金黄洋葱，两者都切成条状。"},
    {it:"Li ho salati e li ho cotti a fiamma alta per 5 min fino a quando non si sono ammorbiditi.",zh:"我加了点盐，用大火翻炒了大约 5 分钟，直到它们变软。"},
    {it:"Ho poi preparato dell'hummus con la ricetta che vi lascio qui sotto.",zh:"然后，我准备了一些鹰嘴豆泥，具体的食谱我会在下面分享给大家。"},
    {it:"E poi ho messo tutto in tavola aggiungendo anche 200g di fagioli rossi già cotti che saranno la fonte proteica di questo piatto insieme all'hummus.",zh:"接着，我把所有食材摆上桌，还额外加了 200 克熟红豆，它们和鹰嘴豆泥一起，成为这道菜的蛋白质来源。"},
    {it:"Durante la cena quindi ognuno di noi ha composto le proprie piadine nella maniera che preferiva.",zh:"在晚餐期间，每个人都可以按照自己的喜好来搭配馅料，制作属于自己的美味皮塔饼。"},
  ],
  vocab:[
    {e:"impasto",m:"面团",d:"名词，混合制成的面团或糊状物。",ex:"L'impasto della pizza deve riposare almeno due ore.",exZh:"披萨面团至少需要发酵两小时。"},
    {e:"palline",m:"小球",d:"\"palla\"（球）的小型形式。",ex:"Ho formato delle palline di pasta per fare i biscotti.",exZh:"我做了一些小面团球来做饼干。"},
    {e:"ho stese",m:"我把它们擀平",d:"动词\"stendere\"（展开、擀平）的过去时。",ex:"Ho stese le lasagne sulla teglia prima di cuocerle.",exZh:"烹饪前我把千层面片铺平在烤盘上。"},
    {e:"cercando di mantenere",m:"尽量保持",d:"\"cercare di\"+不定式=尝试做某事。",ex:"Sto cercando di mantenere un ritmo costante di studio.",exZh:"我正在尽量保持稳定的学习节奏。"},
    {e:"rotonda",m:"圆形的",d:"形容词，描述圆形。",ex:"La luna era perfettamente rotonda quella notte.",exZh:"那晚的月亮是完美的圆形。"},
    {e:"cotte in padella",m:"在平底锅中烤/煮",d:"\"cuocere\"过去分词+\"in padella\"=在平底锅中。",ex:"Le verdure cotte in padella mantengono più vitamine.",exZh:"平底锅烹调的蔬菜保留更多维生素。"},
    {e:"più o meno",m:"大约",d:"表示\"或多或少\"、\"大致上\"。",ex:"Il viaggio durerà più o meno tre ore.",exZh:"旅程大约需要三小时。"},
    {e:"fuoco medio",m:"中火",d:"烹饪术语，中等火力。",ex:"Cuoci la salsa a fuoco medio mescolando spesso.",exZh:"用中火煮酱汁，经常搅拌。"},
    {e:"condirle",m:"调味",d:"动词\"condire\"（调味）不定式+代词\"le\"。",ex:"Prima di servire l'insalata, devo condirla con olio e aceto.",exZh:"上菜前，我要用油和醋给沙拉调味。"},
    {e:"saltare un peperone",m:"炒辣椒",d:"\"saltare\"在烹饪中指快速翻炒。",ex:"Mi piace saltare i funghi in padella con aglio.",exZh:"我喜欢在平底锅里用蒜炒蘑菇。"},
    {e:"una cipolla dorata",m:"一个金黄的洋葱",d:"\"dorata\"指金黄色的（炒熟的颜色）。",ex:"Soffriggi la cipolla fino a quando diventa dorata.",exZh:"炒洋葱直到它变成金黄色。"},
    {e:"entrambi tagliati a strisce",m:"两者都切成条状",d:"\"entrambi\"=两者都；\"a strisce\"=成条状。",ex:"Prepara i peperoni e le carote entrambi tagliati a strisce sottili.",exZh:"准备辣椒和胡萝卜，两者都切成细条。"},
    {e:"un filo d'olio",m:"一点橄榄油",d:"形象表达，字面\"一根油线\"，指少量油。",ex:"Aggiungi un filo d'olio sull'insalata prima di servirla.",exZh:"上沙拉前加一点橄榄油。"},
    {e:"cotti a fiamma alta",m:"大火烹饪",d:"\"cuocere\"过去分词+\"a fiamma alta\"=用大火。",ex:"I gamberi vanno cotti a fiamma alta per pochissimo tempo.",exZh:"虾需要大火短时烹饪。"},
    {e:"fino a quando non si sono ammorbiditi",m:"直到它们变软",d:"\"fino a quando\"=直到；\"ammorbidirsi\"=变软。",ex:"Cuoci le patate fino a quando non si sono ammorbidite abbastanza.",exZh:"煮土豆直到它们变得足够软。"},
    {e:"hummus",m:"鹰嘴豆泥",d:"由鹰嘴豆、芝麻酱、柠檬和香料制成的酱。",ex:"L'hummus è perfetto da servire con il pane pita.",exZh:"鹰嘴豆泥配皮塔饼是完美搭配。"},
    {e:"ho messo tutto in tavola",m:"把一切摆上桌",d:"\"mettere\"+\"in tavola\"=摆好饭桌。",ex:"Quando ho messo tutto in tavola, abbiamo iniziato a cenare.",exZh:"当我摆好餐桌，我们就开始晚餐。"},
    {e:"fagioli rossi già cotti",m:"已煮熟的红豆",d:"\"fagioli rossi\"=红豆；\"già cotti\"=已煮熟的。",ex:"Per risparmiare tempo, uso spesso fagioli rossi già cotti in scatola.",exZh:"为节省时间，我常用罐装熟红豆。"},
    {e:"la fonte proteica",m:"蛋白质来源",d:"营养学术语，蛋白质的来源。",ex:"La carne è una buona fonte proteica nella dieta.",exZh:"肉类是饮食中良好的蛋白质来源。"},
    {e:"durante la cena",m:"在晚餐期间",d:"时间表达，晚餐进行的时候。",ex:"Durante la cena abbiamo discusso dei nostri progetti futuri.",exZh:"晚餐期间我们讨论了未来计划。"},
    {e:"ognuno di noi",m:"我们每个人",d:"\"ognuno\"=每个人；\"di noi\"=我们的。",ex:"Ognuno di noi ha un compito specifico da svolgere.",exZh:"我们每个人都有一个特定任务要完成。"},
    {e:"nella maniera che preferiva",m:"按照各自喜欢的方式",d:"\"nella maniera\"=以...方式；\"che preferiva\"=喜欢的。",ex:"Ciascuno può decorare il proprio dolce nella maniera che preferisce.",exZh:"每个人可以按自己喜欢的方式装饰甜点。"},
  ]
 },
4: {
  zh:"今天是星期天，我们一起度过。现在我正在等我姐姐，好一起去市中心散步。在这个 vlog 里，我的新眼镜首次亮相，终于能看清楚了！现在是早上 9:30，我们早点出门去市中心，这样能早些回来吃午饭。而且，早点出门的话，我希望能遇到比平时更少的人。毕竟，通常周日的早晨大家都会悠闲一点，对吧？所以散步的人一般都会晚点出门，可能在 11 点或 11 点半左右，或者干脆午饭后下午才出去。",
  it:"Oggi è domenica e la passiamo insieme. Adesso sto aspettando mia sorella per andare a fare una passeggiata in centro. In questo vlog fanno il loro debutto i miei occhiali nuovi e finalmente vedo bene. Sono le 9:30 e così andiamo di buon'ora in centro, così torniamo presto per pranzo. E andando presto spero anche di trovare meno gente del solito perché di solito la domenica le persone se la prendono comoda la mattina, no? E quindi per la passeggiata si esce un po' più tardi, magari verso le 11/11:30 oppure direttamente nel pomeriggio dopo pranzo.",
  sent:[
    {it:"Oggi è domenica e la passiamo insieme.",zh:"今天是星期天，我们一起度过。"},
    {it:"Adesso sto aspettando mia sorella per andare a fare una passeggiata in centro.",zh:"现在我正在等我姐姐，好一起去市中心散步。"},
    {it:"In questo vlog fanno il loro debutto i miei occhiali nuovi e finalmente vedo bene.",zh:"在这个 vlog 里，我的新眼镜首次亮相，终于能看清楚了！"},
    {it:"Sono le 9:30 e così andiamo di buon'ora in centro, così torniamo presto per pranzo.",zh:"现在是早上 9:30，我们早点出门去市中心，这样能早些回来吃午饭。"},
    {it:"E andando presto spero anche di trovare meno gente del solito perché di solito la domenica le persone se la prendono comoda la mattina, no?",zh:"而且，早点出门的话，我希望能遇到比平时更少的人。毕竟，通常周日的早晨大家都会悠闲一点，对吧？"},
    {it:"E quindi per la passeggiata si esce un po' più tardi, magari verso le 11/11:30 oppure direttamente nel pomeriggio dopo pranzo.",zh:"所以散步的人一般都会晚点出门，可能在 11 点或 11 点半左右，或者干脆午饭后下午才出去。"},
  ],
  vocab:[
    {e:"Oggi è domenica e la passiamo insieme",m:"今天是星期天，我们一起度过",d:"\"passare\"在此处表示\"度过(时间)\"。",ex:"Passiamo il weekend al mare.",exZh:"我们在海边度过周末。"},
    {e:"sto aspettando",m:"我正在等",d:"\"stare + 现在分词\"构成进行时态。",ex:"Sto aspettando l'autobus da mezz'ora.",exZh:"我已经等公交车半小时了。"},
    {e:"andare a fare una passeggiata in centro",m:"去市中心散步",d:"\"andare a fare\"表示\"去做某事\"；\"passeggiata\"=散步；\"in centro\"=在市中心。",ex:"La domenica mi piace andare a fare una passeggiata in centro con gli amici.",exZh:"周日我喜欢和朋友们去市中心散步。"},
    {e:"fanno il loro debutto",m:"首次亮相",d:"\"fare il debutto\"=首次登场、首次出现。",ex:"Gli attori fanno il loro debutto sul palcoscenico nazionale.",exZh:"这些演员在国家舞台上首次亮相。"},
    {e:"vedo bene",m:"能看清楚",d:"\"vedere bene\"=视力良好、看得清楚。",ex:"Con questi occhiali finalmente vedo bene anche da lontano.",exZh:"有了这副眼镜，我终于能看清远处的东西了。"},
    {e:"Sono le 9:30",m:"现在是早上9:30",d:"表达时间的常见结构。",ex:"Sono le otto, è ora di alzarsi.",exZh:"现在是8点，该起床了。"},
    {e:"andiamo di buon'ora",m:"我们早点出门",d:"\"di buon'ora\"=很早、一大早。",ex:"Domani dobbiamo partire di buon'ora per evitare il traffico.",exZh:"明天我们要早点出发以避开交通拥堵。"},
    {e:"torniamo presto per pranzo",m:"早些回来吃午饭",d:"表示回来的目的。",ex:"Torniamo presto per cena, non voglio cucinare tardi.",exZh:"我们早点回来吃晚饭，我不想晚上做饭。"},
    {e:"andando presto",m:"早点出门",d:"\"andare presto\"=早点去。",ex:"Andando presto al supermercato, troviamo i prodotti più freschi.",exZh:"早点去超市，我们能找到更新鲜的产品。"},
    {e:"trovare meno gente del solito",m:"遇到比平时更少的人",d:"\"trovare\"=遇到；\"del solito\"=比平常。",ex:"Il lunedì al museo si trova meno gente del solito.",exZh:"周一去博物馆会遇到比平常更少的人。"},
    {e:"di solito",m:"通常，平常",d:"表示习惯或常态的副词短语。",ex:"Di solito mi sveglio alle sette.",exZh:"我通常七点起床。"},
    {e:"le persone se la prendono comoda",m:"大家都会悠闲一点",d:"\"prendersela comoda\"=不着急、从容不迫地做事。",ex:"Il sabato mattina mi piace prendermela comoda e fare colazione con calma.",exZh:"周六早上我喜欢悠闲一点，慢慢享用早餐。"},
    {e:"si esce un po' più tardi",m:"晚点出门",d:"\"si\"是非人称代词表示\"人们\"；\"un po' più tardi\"=稍晚一点。",ex:"D'estate si esce un po' più tardi perché fa troppo caldo durante il giorno.",exZh:"夏天人们会晚点出门，因为白天太热了。"},
    {e:"verso le 11/11:30",m:"在11点或11点半左右",d:"\"verso\"表示时间时意为\"大约，左右\"。",ex:"Arriverò verso le tre del pomeriggio.",exZh:"我会在下午三点左右到达。"},
    {e:"direttamente nel pomeriggio dopo pranzo",m:"干脆午饭后下午",d:"\"direttamente\"=直接；\"dopo pranzo\"=午饭后。",ex:"Oggi non esco la mattina, andrò in palestra direttamente nel pomeriggio dopo pranzo.",exZh:"今天早上我不出门，午饭后我会直接去健身房。"},
  ]

5: {
  zh:"下午好！现在是 4 点 30 分，我刚刚从午睡中醒来。没办法，躺在沙发上睡着了，结果有点着凉了。所以，我裹上了小毯子，因为屋里很冷，甚至比外面还冷。虽然外面的温度刚刚好，但我还是觉得裹着毯子更舒服。等会儿我们要去公园散步一下，然后按计划，我还得整理明早发言的笔记。因为明天一早，我要录制 Rai Italia 电视节目《Paparazzi》的一期内容。",
  it:"Buon pomeriggio, sono le quattro e mezza. Mi sono appena svegliata dal mio pisolino. E niente, mi sono infreddolita sul divano. Per questo motivo mi sono messa la copertina addosso, perché dentro casa fa freddo. Fa più freddo rispetto a fuori. Fuori si sta bene, però io sto ancora meglio con la mia copertina. Tra un po' andiamo al parco a fare una bella passeggiata e poi in teoria devo scrivere gli appunti per il mio intervento di domattina. Perché domattina presto registro la puntata del programma di Rai Italia \"Paparazzi\".",
  sent:[
    {it:"Buon pomeriggio, sono le quattro e mezza. Mi sono appena svegliata dal mio pisolino.", zh:"下午好！现在是 4 点 30 分，我刚刚从午睡中醒来。"},
    {it:"E niente, mi sono infreddolita sul divano.", zh:"没办法，躺在沙发上睡着了，结果有点着凉了。"},
    {it:"Per questo motivo mi sono messa la copertina addosso, perché dentro casa fa freddo.", zh:"所以，我裹上了小毯子，因为屋里很冷。"},
    {it:"Fa più freddo rispetto a fuori. Fuori si sta bene, però io sto ancora meglio con la mia copertina.", zh:"甚至比外面还冷。虽然外面的温度刚刚好，但我还是觉得裹着毯子更舒服。"},
    {it:"Tra un po' andiamo al parco a fare una bella passeggiata e poi in teoria devo scrivere gli appunti per il mio intervento di domattina.", zh:"等会儿我们要去公园散步一下，然后按计划，我还得整理明早发言的笔记。"},
    {it:"Perché domattina presto registro la puntata del programma di Rai Italia \"Paparazzi\".", zh:"因为明天一早，我要录制 Rai Italia 电视节目《Paparazzi》的一期内容。"}
  ],
  vocab:[
    {e:"Buon pomeriggio", m:"下午好", d:"\"Buon\"=好的；\"pomeriggio\"=下午。意大利语下午问候语。", ex:"Buon pomeriggio, signora. Come sta oggi?", exZh:"下午好，夫人。您今天好吗？"},
    {e:"appena svegliata", m:"刚刚醒来", d:"\"appena\"=刚刚；\"svegliata\"=醒来的（阴性）。同义词：svegliarsi da poco。", ex:"Sono appena svegliata e ho bisogno di un caffè.", exZh:"我刚醒，需要喝杯咖啡。"},
    {e:"pisolino", m:"午睡，小睡", d:"\"pisolino\"=小睡、午觉，指白天短暂的小憩。", ex:"Dopo pranzo faccio sempre un pisolino di mezz'ora.", exZh:"午饭后我总是小睡半小时。"},
    {e:"infreddolita", m:"感到寒冷，受凉", d:"\"infreddolirsi\"=感到发冷、受凉，此处为阴性过去分词。", ex:"Ero infreddolita dopo essere stata fuori sotto la pioggia.", exZh:"在雨中淋过后我感到发冷。"},
    {e:"divano", m:"沙发", d:"\"divano\"=沙发。", ex:"Mi sono addormentata sul divano mentre guardavo la TV.", exZh:"我看电视时在沙发上睡着了。"},
    {e:"messa la copertina addosso", m:"把毯子盖在身上", d:"\"mettersi qualcosa addosso\"=把某物裹/盖在身上；\"copertina\"=小毯子。", ex:"Mi sono messa la copertina addosso perché avevo freddo.", exZh:"我因为冷而把毯子盖在身上。"},
    {e:"dentro casa", m:"在屋内，在家里", d:"\"dentro\"=在…里面；\"casa\"=家。与\"fuori casa\"（屋外）相对。", ex:"Dentro casa si sta al caldo anche quando fuori nevica.", exZh:"即使外面下雪，屋里也很暖和。"},
    {e:"fa freddo", m:"天气冷", d:"\"fa freddo\"=天冷，意大利语用\"fare\"表达天气。", ex:"Oggi fa freddo, mettiti il cappotto.", exZh:"今天很冷，穿上外套。"},
    {e:"Fa più freddo rispetto a fuori", m:"比外面还冷", d:"\"rispetto a\"=与…相比。同义词：fa più freddo dentro che fuori。", ex:"In cantina fa più freddo rispetto a fuori in questa stagione.", exZh:"这个季节地下室比外面还冷。"},
    {e:"Fuori si sta bene", m:"外面天气舒适", d:"\"si sta bene\"=待着很舒服，\"si\"为非人称形式。", ex:"Oggi fuori si sta bene, è una giornata perfetta per un picnic.", exZh:"今天外面天气很好，是野餐的好日子。"},
    {e:"sto ancora meglio", m:"感觉更舒服", d:"\"sto meglio\"=我感觉更好；\"ancora\"=更、还。同义词：mi sento meglio。", ex:"Con questa medicina sto ancora meglio di prima.", exZh:"用了这药后我感觉比以前更好了。"},
    {e:"copertina", m:"小毯子", d:"\"copertina\"=小毯子、盖毯，是\"coperta\"（毯子）的指小词。", ex:"Mi piace leggere con una copertina sulle gambe in inverno.", exZh:"冬天我喜欢盖着毯子看书。"},
    {e:"Tra un po'", m:"过一会儿，一会儿后", d:"\"tra\"=在…之后；\"un po'\"=一点、一会儿。同义词：fra poco tempo。", ex:"Tra un po' andremo a cena fuori.", exZh:"过一会儿我们就出去吃晚饭。"},
    {e:"al parco", m:"在公园", d:"\"al\"=在…（a+il 缩合）；\"parco\"=公园。", ex:"I bambini giocano al parco ogni pomeriggio.", exZh:"孩子们每天下午在公园玩耍。"},
    {e:"bella passeggiata", m:"愉快的散步", d:"\"bella\"=美好的；\"passeggiata\"=散步。", ex:"Abbiamo fatto una bella passeggiata lungo il fiume.", exZh:"我们沿着河边进行了一次愉快的散步。"},
    {e:"in teoria", m:"理论上，按计划", d:"\"in teoria\"=理论上、按说。同义词：secondo i piani。", ex:"In teoria dovremmo finire il progetto entro venerdì.", exZh:"理论上我们应该在周五前完成这个项目。"},
    {e:"appunti", m:"笔记", d:"指为了记忆或将来参考而做的简短记录。", ex:"Ho preso degli appunti durante la conferenza.", exZh:"我在会议期间做了笔记。"},
    {e:"intervento", m:"发言，讲话，干预", d:"指在公开场合发表的讲话或表达意见。同义词：discorso。", ex:"Il suo intervento alla riunione è stato molto apprezzato.", exZh:"他在会议上的发言受到了高度赞赏。"},
    {e:"domattina", m:"明天早上", d:"\"domattina\"=明天早上（domani mattina 的合写）。", ex:"Domattina mi alzerò presto per andare in palestra.", exZh:"明天早上我会早起去健身房。"},
    {e:"domattina presto", m:"明天一大早", d:"\"presto\"=早；\"domattina presto\"=明天一大早。", ex:"Domattina presto devo prendere il treno per Roma.", exZh:"明天一大早我要坐火车去罗马。"},
    {e:"registro la puntata", m:"录制节目", d:"\"registrare\"=录制；\"puntata\"=（连续节目的）一集。同义词：registrare un episodio。", ex:"Oggi registro la puntata del mio podcast.", exZh:"今天我要录制我的播客节目。"},
    {e:"programma", m:"节目，计划", d:"指电视或广播的特定节目。同义词：trasmissione。", ex:"Questo programma va in onda ogni martedì sera.", exZh:"这个节目每周二晚上播出。"},
    {e:"Rai Italia", m:"意大利广播电视台", d:"Rai 为意大利国家广播电视台（Radiotelevisione Italiana）的缩写；Italia 为其国际频道。", ex:"Rai Italia trasmette programmi italiani in tutto il mondo.", exZh:"意大利广播电视台向全世界播放意大利节目。"}
  ]
},


6: {
  zh:"在米兰这样一座以时尚、艺术和高端场所闻名的城市，要靠少量预算度过一天似乎是不可能的。好吧，今天我口袋里只有10欧元，这些钱能做什么呢？我们去街头问问大家的看法。在米兰，10欧元能买到什么？——我不知道，我来自热那亚。——没多少东西，救命。——在一天之内？当然能买点好吃的……还有一些小玩意儿。——所以，10欧元基本上能买到这些东西，但肯定能吃到点好吃的。在米兰，10欧元能买什么？——这个问题得问我老婆，她负责买菜。——我自己嘛，不知道，可能能买一杯卡布奇诺和一个羊角面包，然后再买点别的，但真的不多。——要靠10欧元吃一天饭。——在一整天内？那么，为了能吃饭，最多就是两个三明治。没有夹馅的，否则很难用10欧元。——哦，这有点夸张了。——很少很少。——在一天之内。——嗯，也许可以买一本便宜的书籍，可能一本，然后喝杯咖啡，吃个早餐和一个三明治，勉强一个三明治，加一瓶装水，但不会更多了。——地铁票。——也许在某个地方买个三明治？——麦当劳。——没错，可能就买个麦当劳。热那亚比米兰更贵还是更便宜？——可能更贵。——更贵？——是的。——10欧元在热那亚能买到的东西？——差不多的东西，或多或少差不多的东西。即使有些价格更高，服装和商业产品在几乎所有城市的价格都差不多。意大利北部和南部的物价会有点区别，但热那亚也是北部城市，所以价格基本相同。只是像零食、饮料、那些东西可能在一个地方比另一个地方贵一点，但总体来说，价格差不多。",
  it:"In una città come Milano, famosa per la moda, per l'arte, per i locali di lusso, sembra impossibile sopravvivere o vivere la giornata con un budget piccolo. Bene, oggi ho solo 10 euro in tasca. Cosa posso fare con questi soldi? Andiamo a chiederlo in giro. Cosa puoi comprare a Milano con 10 euro? Non ne ho idea, sono di Genova. Poche cose. Aiuto. In una giornata? E sicuramente del buon cibo, comunque... e poi anche tanta gadgettistica. Quindi con 10 euro quello, ma sicuro il buon cibo. Con 10 euro a Milano? Bisognerebbe chiederlo a mia moglie: è lei che fa la spesa. Io con 10 euro magari, non so, un cappuccio, una brioche e poi qualcos'altro, ma poca cosa comunque. In una giornata. In una giornata intera? Allora diciamo, per poter mangiare, massimo un paio di panini. Senza niente dentro, perché altrimenti è difficile con 10 euro. Beh, è un po' esagerato. Ben poco. In una giornata. Beh, magari qualche libro economico, forse uno, prendersi un caffè, fare colazione e un panino, a stenti con un panino, con una bottiglia d'acqua, direi non molto di più. Il biglietto della metropolitana. E forse un panino da qualche parte? McDonald. Esatto, forse un Mac. Genova è più cara o più economica rispetto a Milano? Probabilmente è più cara. Più cara? Sì. Cosa puoi comprare a Genova con 10 euro? Le stesse cose, più o meno le stesse cose. Anche con cifre più alte, vestiti e i prodotti commerciali più o meno sono dello stesso prezzo in quasi tutte le città. C'è un po' di differenza tra nord Italia e Sud Italia sui prezzi, però Genova è comunque nord Italia, quindi i prezzi si aggirano più o meno uguali. Giusto, prodotti tipo gli snack, le bibite, quelle cose lì magari costano un po' di più da una parte rispetto che dall'altra, ma alla fine il prezzo è più o meno lo stesso.",
  sent:[
    {it:"In una città come Milano, famosa per la moda, per l'arte, per i locali di lusso, sembra impossibile sopravvivere o vivere la giornata con un budget piccolo. Bene, oggi ho solo 10 euro in tasca. Cosa posso fare con questi soldi? Andiamo a chiederlo in giro.",zh:"在米兰这样一座以时尚、艺术和高端场所闻名的城市，要靠少量预算度过一天似乎是不可能的。好吧，今天我口袋里只有10欧元，这些钱能做什么呢？我们去街头问问大家的看法。"},
